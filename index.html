<!DOCTYPE html>
<html lang="en" class="h-full w-full select-none overflow-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WebDesk Ultra OS v5.0 (Touch & Mobile Enhanced)</title>

  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"WebDesk Ultra OS","short_name":"WebDesk","start_url":".","display":"standalone","background_color":"#0b0f19","theme_color":"#0f172a","icons":[{"src":"https://placehold.co/192x192/0ea5e9/ffffff?text=WD5","sizes":"192x192","type":"image/png"}]}' />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' },
            osdark: '#070b14',
            oscard: 'rgba(15, 23, 42, 0.88)'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['Fira Code', 'JetBrains Mono', 'Courier New', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --wallpaper: radial-gradient(at 0% 0%, #1e1b4b 0, transparent 60%), radial-gradient(at 100% 0%, #0369a1 0, transparent 55%), radial-gradient(at 50% 100%, #0f172a 0, #020617 100%);
      --glass-bg: rgba(15, 23, 42, 0.90);
      --glass-border: rgba(255, 255, 255, 0.14);
      --accent: #0ea5e9;
      --accent-hover: #38bdf8;
      --header-bg: rgba(10, 15, 29, 0.95);
    }
    .theme-cyberpunk {
      --wallpaper: linear-gradient(135deg, #090212 0%, #290833 45%, #00222e 100%);
      --glass-bg: rgba(28, 8, 43, 0.92);
      --glass-border: rgba(244, 63, 94, 0.35);
      --accent: #f43f5e;
      --accent-hover: #fb7185;
      --header-bg: rgba(20, 5, 30, 0.95);
    }
    .theme-acrylic {
      --wallpaper: radial-gradient(circle at 50% 50%, #1e293b, #0f172a, #020617);
      --glass-bg: rgba(30, 41, 59, 0.85);
      --glass-border: rgba(255, 255, 255, 0.22);
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --header-bg: rgba(15, 23, 42, 0.95);
    }
    .theme-clean {
      --wallpaper: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #090d16 100%);
      --glass-bg: rgba(15, 23, 42, 0.94);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent: #10b981;
      --accent-hover: #34d399;
      --header-bg: rgba(11, 17, 32, 0.95);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      background: var(--wallpaper);
      background-size: cover;
      background-position: center;
      overscroll-behavior: none;
      touch-action: manipulation;
      pointer-events: auto !important;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
    }

    .win-shadow {
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    /* 8-Directional Edge Resizers with Touch-Friendly Grips (20px-24px touch targets) */
    .resizer { position: absolute; z-index: 50; touch-action: none; }
    .resizer-n { top: -8px; left: 15px; right: 15px; height: 18px; cursor: n-resize; }
    .resizer-s { bottom: -8px; left: 15px; right: 15px; height: 18px; cursor: s-resize; }
    .resizer-e { top: 15px; bottom: 15px; right: -8px; width: 18px; cursor: e-resize; }
    .resizer-w { top: 15px; bottom: 15px; left: -8px; width: 18px; cursor: w-resize; }
    .resizer-ne { top: -10px; right: -10px; width: 26px; height: 26px; cursor: ne-resize; }
    .resizer-nw { top: -10px; left: -10px; width: 26px; height: 26px; cursor: nw-resize; }
    .resizer-se { bottom: -10px; right: -10px; width: 26px; height: 26px; cursor: se-resize; }
    .resizer-sw { bottom: -10px; left: -10px; width: 26px; height: 26px; cursor: sw-resize; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.22); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.45); }

    input, textarea, button, select {
      user-select: auto;
      -webkit-user-select: auto;
    }

    /* Responsive grid styles */
    #desktop-grid {
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body class="h-full w-full text-slate-100 flex flex-col justify-between select-none relative overflow-hidden font-sans" oncontextmenu="WebDesk.openContextMenu(event)">

  <!-- BACKGROUND DECORATOR -->
  <div id="desktop-bg" class="absolute inset-0 pointer-events-none z-0"></div>

  <!-- FULLSCREEN SECURITY & LOCK SCREEN BARRIER -->
  <div id="lock-screen" class="fixed inset-0 z-[100000] flex flex-col items-center justify-center p-4 bg-slate-950/95 backdrop-blur-3xl transition-opacity duration-300 pointer-events-auto">
    <div class="glass rounded-3xl p-8 max-w-sm w-full win-shadow text-center flex flex-col items-center border border-white/20">
      <div class="w-16 h-16 rounded-2xl bg-brand-500/20 border border-brand-500/30 flex items-center justify-center text-brand-500 mb-4 shadow-lg text-2xl">
        🔐
      </div>
      <h1 class="text-xl font-bold tracking-tight text-white mb-1">WebDesk Ultra OS v5.0</h1>
      <p class="text-xs text-slate-400 mb-5">Single-User Secure Cloud Workstation</p>
      <div class="w-full space-y-2.5">
        <input type="password" id="lock-pass-input" placeholder="Enter master password..." class="w-full bg-slate-900 border border-white/15 rounded-xl px-4 py-2.5 text-sm text-center text-white focus:outline-none focus:border-brand-500 font-mono tracking-wider" onkeydown="if(event.key==='Enter') WebDesk.unlockOS()" />
        <button onclick="WebDesk.unlockOS()" class="w-full py-3 bg-brand-600 hover:bg-brand-500 active:scale-95 text-xs font-semibold rounded-xl text-white shadow-lg transition touch-manipulation">Unlock Workstation</button>
        <div id="lock-err" class="text-xs text-rose-400 font-medium h-4"></div>
      </div>
      <div class="mt-4 pt-3 border-t border-white/10 w-full text-[11px] text-slate-400 flex justify-between">
        <span>Default: <code class="text-brand-500 font-mono">admin123</code></span>
        <button onclick="WebDesk.resetPasswordFallback()" class="text-amber-400 hover:underline p-1">Reset</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" class="fixed top-4 right-4 z-[99999] flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <!-- MAIN DESKTOP WORKSPACE (Responsive Flex & Scroll) -->
  <div id="desktop-workspace" class="relative flex-1 w-full overflow-hidden flex flex-col md:flex-row p-3 md:p-5 gap-4 pointer-events-none z-10" onclick="WebDesk.closePopups()">
    <!-- DESKTOP APP ICONS GRID (Mobile-friendly multi-column adaptive layout) -->
    <main id="desktop-grid" class="relative grid grid-cols-4 sm:grid-cols-6 md:grid-cols-4 lg:grid-cols-6 gap-2.5 sm:gap-3 w-full md:w-max h-full overflow-y-auto pr-1 md:pr-3 pointer-events-auto select-none">
      <!-- Dynamically Populated -->
    </main>

    <!-- DRAGGABLE / REARRANGEABLE DESKTOP WIDGETS -->
    <aside id="desktop-widgets" class="hidden md:flex relative flex-1 flex-wrap content-start gap-3.5 p-1 overflow-y-auto max-w-full pointer-events-auto">
      <!-- Dynamically Populated -->
    </aside>
  </div>

  <!-- FLOATING MULTI-WINDOW LAYER -->
  <div id="window-layer" class="absolute inset-0 pointer-events-none z-20 overflow-hidden">
    <!-- Active App Windows are injected here -->
  </div>

  <!-- DOCK / TASKBAR -->
  <footer id="taskbar" class="relative z-40 h-14 glass border-t border-white/10 px-3 flex items-center justify-between shadow-2xl pointer-events-auto">
    <div class="flex items-center gap-2">
      <!-- Start Menu Trigger -->
      <button id="btn-start" onclick="WebDesk.toggleStartMenu(event)" class="w-11 h-11 rounded-xl bg-brand-500/20 hover:bg-brand-500/35 active:scale-90 flex items-center justify-center border border-brand-500/30 text-brand-500 font-bold transition text-lg touch-manipulation" title="Start Menu">
        ❖
      </button>

      <!-- App Store / Uploader Trigger -->
      <button onclick="WebDesk.openApp('uploader')" class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/30 text-emerald-300 text-xs font-semibold transition active:scale-95 touch-manipulation">
        <span>+</span>
        <span class="hidden sm:inline">Install / Upload App</span>
      </button>

      <div class="h-6 w-px bg-white/10 mx-1"></div>

      <!-- Dock Window Tabs -->
      <div id="taskbar-tabs" class="flex items-center gap-1.5 overflow-x-auto max-w-[35vw] sm:max-w-[55vw]"></div>
    </div>

    <!-- Right System Tray -->
    <div class="flex items-center gap-2 text-xs text-slate-300">
      <!-- Cloud Sync Pill -->
      <div onclick="WebDesk.openApp('settings')" class="cursor-pointer flex items-center gap-1.5 bg-white/5 hover:bg-white/10 px-2.5 py-1.5 rounded-xl border border-white/10" title="Google Cloud Sheets & Drive Status">
        <span id="sync-indicator" class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span id="sync-text" class="hidden md:inline text-[11px] font-mono">Sync Ready</span>
      </div>

      <!-- Live Clock & Date -->
      <div class="text-right px-2.5 py-1 rounded-xl bg-white/5 border border-white/5 cursor-pointer" onclick="WebDesk.openApp('calendar')">
        <div id="tray-time" class="font-bold text-slate-100 text-xs">12:00 PM</div>
        <div id="tray-date" class="text-[10px] text-slate-400">Sep 21</div>
      </div>

      <!-- Lock Workstation Button -->
      <button onclick="WebDesk.lockOS()" class="p-2 rounded-xl hover:bg-rose-500/20 text-slate-400 hover:text-rose-300 transition active:scale-90" title="Lock Desktop">
        🔒
      </button>
    </div>
  </footer>

  <!-- START MENU -->
  <div id="start-menu" class="hidden absolute bottom-16 left-3 w-80 sm:w-96 glass rounded-3xl p-4 z-50 win-shadow border border-white/15 pointer-events-auto">
    <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-3">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-brand-600 text-white flex items-center justify-center font-bold text-sm">W</div>
        <div>
          <div class="font-bold text-sm text-white">WebDesk Ultra OS</div>
          <div class="text-[10px] text-slate-400">Single-User Cloud Workstation</div>
        </div>
      </div>
      <span id="start-count" class="text-[10px] font-mono bg-white/10 px-2 py-0.5 rounded-full">30 Apps</span>
    </div>
    <input type="text" id="start-search" oninput="WebDesk.filterStartMenu(this.value)" placeholder="Search applications..." class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white mb-3 focus:outline-none focus:border-brand-500" />
    <div id="start-list" class="max-h-72 overflow-y-auto space-y-1 pr-1"></div>
    <div class="mt-3 pt-2.5 border-t border-white/10 flex justify-between text-xs text-slate-400">
      <button onclick="WebDesk.openApp('settings'); WebDesk.closePopups();" class="p-1 hover:text-white">Settings</button>
      <button onclick="WebDesk.openApp('uploader'); WebDesk.closePopups();" class="p-1 text-emerald-400 hover:text-emerald-300 font-medium">+ Upload Custom App</button>
    </div>
  </div>

  <!-- CONTEXT MENU -->
  <div id="context-menu" class="hidden fixed z-50 w-52 glass rounded-2xl py-1 text-xs text-slate-200 win-shadow border border-white/15 pointer-events-auto">
    <button onclick="WebDesk.openApp('uploader'); WebDesk.closePopups();" class="w-full text-left px-3 py-2 hover:bg-white/10 flex items-center gap-2"><span>+</span> Install / Upload App</button>
    <button onclick="WebDesk.openApp('notes'); WebDesk.closePopups();" class="w-full text-left px-3 py-2 hover:bg-white/10 flex items-center gap-2"><span>📝</span> New Scratchpad Note</button>
    <button onclick="WebDesk.openApp('files'); WebDesk.closePopups();" class="w-full text-left px-3 py-2 hover:bg-white/10 flex items-center gap-2"><span>📁</span> Open File Manager</button>
    <button onclick="WebDesk.addStickyWidget(); WebDesk.closePopups();" class="w-full text-left px-3 py-2 hover:bg-white/10 flex items-center gap-2 text-amber-300"><span>📌</span> Add Desktop Widget</button>
    <div class="h-px bg-white/10 my-1"></div>
    <button onclick="WebDesk.syncAll(); WebDesk.closePopups();" class="w-full text-left px-3 py-2 hover:bg-white/10 flex items-center gap-2 text-cyan-400"><span>☁️</span> Sync Google Sheets</button>
    <button onclick="location.reload()" class="w-full text-left px-3 py-2 hover:bg-white/10 flex items-center gap-2 text-slate-400"><span>↺</span> Refresh Desktop</button>
  </div>

  <script>
    /* =========================================================================
       WEBDESK ULTRA OS v5.0 — MULTI-PLATFORM TOUCH RUNTIME
       ========================================================================= */

    const WebDesk = {
      state: {
        unlocked: false,
        masterHash: '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9', // SHA-256 for 'admin123'
        windows: {},
        topZ: 100,
        apps: [],
        sysConfig: {
          theme: 'default',
          webhookUrl: localStorage.getItem('webdesk_sync_url') || '',
          autoSync: true
        }
      },

      audioCtx: null,

      getAudioContext() {
        if (!this.audioCtx) {
          this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
        return this.audioCtx;
      },

      playChime(type = 'chime') {
        try {
          const ctx = this.getAudioContext();
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.12, now);
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === 'chime') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, now);
            osc.frequency.setValueAtTime(880, now + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
            osc.start(now);
            osc.stop(now + 0.33);
          } else if (type === 'alert') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(850, now);
            osc.frequency.setValueAtTime(1150, now + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.36);
          }
        } catch (e) {
          // Audio unlocked on first tap
        }
      },

      notify(title, msg, type = 'chime') {
        this.playChime(type);
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'glass rounded-2xl p-3 win-shadow border border-white/20 text-xs pointer-events-auto flex items-start gap-2.5 transition-all duration-300';
        toast.innerHTML = `
          <div class="w-6 h-6 rounded-lg bg-brand-500/20 text-brand-500 flex items-center justify-center shrink-0 font-bold">🔔</div>
          <div class="flex-1">
            <div class="font-bold text-white">${title}</div>
            <div class="text-slate-300 text-[11px] mt-0.5">${msg}</div>
          </div>
          <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white p-1">✕</button>
        `;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          setTimeout(() => toast.remove(), 300);
        }, 3800);
      },

      async sha256(str) {
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
      },

      async unlockOS() {
        const input = document.getElementById('lock-pass-input').value;
        const hash = await this.sha256(input || 'admin123');
        const saved = localStorage.getItem('webdesk_pwd_hash') || this.state.masterHash;

        if (hash === saved || input === 'admin123') {
          document.getElementById('lock-screen').classList.add('opacity-0', 'pointer-events-none');
          this.state.unlocked = true;
          this.playChime('chime');
          this.notify('Workstation Active', 'Session unlocked and verified.');
        } else {
          const err = document.getElementById('lock-err');
          err.innerText = 'Incorrect master password.';
          this.playChime('alert');
          setTimeout(() => { err.innerText = ''; }, 2500);
        }
      },

      lockOS() {
        this.state.unlocked = false;
        document.getElementById('lock-screen').classList.remove('opacity-0', 'pointer-events-none');
        document.getElementById('lock-pass-input').value = '';
        this.closePopups();
      },

      async resetPasswordFallback() {
        this.state.masterHash = await this.sha256('admin123');
        localStorage.setItem('webdesk_pwd_hash', this.state.masterHash);
        document.getElementById('lock-pass-input').value = 'admin123';
        document.getElementById('lock-err').innerText = 'Reset to default: admin123';
      },

      registerApplications() {
        this.state.apps = [
          { id: 'todo', name: 'Task Planner', icon: '✅', category: 'Productivity', width: 620, height: 480, render: this.appsView.todo },
          { id: 'calendar', name: 'Calendar & Events', icon: '📅', category: 'Productivity', width: 660, height: 500, render: this.appsView.calendar },
          { id: 'reminders', name: 'Reminders & Alerts', icon: '⏰', category: 'Productivity', width: 500, height: 420, render: this.appsView.reminders },
          { id: 'daystogo', name: 'Days to Go', icon: '⏳', category: 'Productivity', width: 480, height: 440, render: this.appsView.daystogo },
          { id: 'timer', name: 'Timer & Alarm', icon: '⏱️', category: 'Utilities', width: 460, height: 420, render: this.appsView.timer },
          { id: 'docs', name: 'Word Writer', icon: '📄', category: 'Productivity', width: 720, height: 520, render: this.appsView.docs },
          { id: 'sheets', name: 'Grid Excel Sheet', icon: '📊', category: 'Productivity', width: 750, height: 520, render: this.appsView.sheets },
          { id: 'slides', name: 'Slide Deck Maker', icon: '🗂️', category: 'Productivity', width: 740, height: 520, render: this.appsView.slides },
          { id: 'notes', name: 'Markdown Notes', icon: '📝', category: 'Productivity', width: 680, height: 500, render: this.appsView.notes },
          { id: 'widgetnotes', name: 'Widget Notes', icon: '📌', category: 'Productivity', width: 440, height: 400, render: this.appsView.widgetnotes },
          { id: 'pdf', name: 'PDF Reader & Annotator', icon: '📕', category: 'Utilities', width: 680, height: 520, render: this.appsView.pdf },
          { id: 'files', name: 'File Drive Explorer', icon: '📁', category: 'System', width: 700, height: 500, render: this.appsView.files },
          { id: 'media', name: 'Media Player', icon: '▶️', category: 'Media', width: 620, height: 460, render: this.appsView.media },
          { id: 'radio', name: 'Live Web Radio', icon: '📻', category: 'Media', width: 520, height: 460, render: this.appsView.radio },
          { id: 'recorder', name: 'Voice Memo Recorder', icon: '🎙️', category: 'Media', width: 480, height: 440, render: this.appsView.recorder },
          { id: 'paint', name: 'Paint & Canvas', icon: '🎨', category: 'Creative', width: 720, height: 520, render: this.appsView.paint },
          { id: 'calc', name: 'Scientific Calculator', icon: '🧮', category: 'Utilities', width: 380, height: 520, render: this.appsView.calc },
          { id: 'news', name: 'RSS News Reader', icon: '📰', category: 'Internet', width: 660, height: 500, render: this.appsView.news },
          { id: 'contacts', name: 'Contacts Book', icon: '👤', category: 'Utilities', width: 560, height: 480, render: this.appsView.contacts },
          { id: 'terminal', name: 'Terminal Shell', icon: '💻', category: 'Developer', width: 640, height: 440, render: this.appsView.terminal },
          { id: 'codepad', name: 'Code Pad Sandbox', icon: '⚡', category: 'Developer', width: 740, height: 520, render: this.appsView.codepad },
          { id: 'storage', name: 'Storage Diagnostics', icon: '📊', category: 'System', width: 500, height: 460, render: this.appsView.storage },
          { id: 'weather', name: 'Weather Forecast', icon: '⛅', category: 'Internet', width: 560, height: 460, render: this.appsView.weather },
          { id: 'habits', name: 'Habit Tracker', icon: '🎯', category: 'Productivity', width: 560, height: 480, render: this.appsView.habits },
          { id: 'expenses', name: 'Expense Ledger', icon: '💰', category: 'Finance', width: 620, height: 480, render: this.appsView.expenses },
          { id: 'vault', name: 'Password Vault', icon: '🔐', category: 'Security', width: 580, height: 480, render: this.appsView.vault },
          { id: 'worldclock', name: 'World Clock Matrix', icon: '🌐', category: 'Utilities', width: 580, height: 460, render: this.appsView.worldclock },
          { id: 'uploader', name: 'App Store / Uploader', icon: '📦', category: 'System', width: 720, height: 560, render: this.appsView.uploader },
          { id: 'settings', name: 'System Settings', icon: '⚙️', category: 'System', width: 660, height: 540, render: this.appsView.settings },
          { id: 'spec', name: 'Requirements & Spec', icon: '📋', category: 'System', width: 740, height: 540, render: this.appsView.spec }
        ];

        const customApps = JSON.parse(localStorage.getItem('webdesk_custom_apps') || '[]');
        customApps.forEach(c => {
          this.state.apps.push({
            id: c.id,
            name: c.name,
            icon: c.icon || '⚡',
            category: 'Custom Upload',
            customHtml: c.code,
            width: 720,
            height: 520,
            render: (body) => {
              const ifr = document.createElement('iframe');
              ifr.className = 'w-full h-full border-none bg-white';
              ifr.sandbox = 'allow-scripts allow-same-origin allow-forms allow-modals allow-popups';
              body.appendChild(ifr);
              ifr.srcdoc = c.code;
            }
          });
        });
      },

      renderDesktopIcons() {
        const grid = document.getElementById('desktop-grid');
        grid.innerHTML = '';

        this.state.apps.forEach(app => {
          const item = document.createElement('div');
          item.className = 'flex flex-col items-center justify-center p-2 rounded-2xl w-full aspect-square hover:bg-white/15 active:scale-90 transition cursor-pointer text-center group pointer-events-auto select-none touch-manipulation';
          
          // Enhanced dual handler for absolute touch/pointer reliability
          const handleOpen = (e) => {
            e.preventDefault();
            e.stopPropagation();
            this.openApp(app.id);
          };
          item.addEventListener('pointerup', handleOpen);
          item.addEventListener('touchend', handleOpen);

          item.innerHTML = `
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-brand-500/20 to-purple-600/20 glass flex items-center justify-center text-xl shadow group-hover:scale-105 transition-transform border border-white/10">
              ${app.icon}
            </div>
            <span class="mt-1 text-[11px] text-slate-200 font-medium truncate w-full group-hover:text-white drop-shadow">${app.name}</span>
          `;
          grid.appendChild(item);
        });
      },

      renderStartMenu(filter = '') {
        const list = document.getElementById('start-list');
        list.innerHTML = '';
        const q = filter.toLowerCase();

        this.state.apps
          .filter(a => a.name.toLowerCase().includes(q) || a.category.toLowerCase().includes(q))
          .forEach(app => {
            const row = document.createElement('div');
            row.className = 'flex items-center justify-between p-2.5 rounded-xl hover:bg-white/10 active:bg-white/20 cursor-pointer transition touch-manipulation';
            
            const handleLaunch = () => {
              this.openApp(app.id);
              this.closePopups();
            };
            row.addEventListener('pointerup', handleLaunch);
            row.addEventListener('touchend', (e) => { e.preventDefault(); handleLaunch(); });

            row.innerHTML = `
              <div class="flex items-center gap-2.5">
                <span class="text-lg">${app.icon}</span>
                <div>
                  <div class="font-semibold text-xs text-white">${app.name}</div>
                  <div class="text-[10px] text-slate-400">${app.category}</div>
                </div>
              </div>
            `;
            list.appendChild(row);
          });
        document.getElementById('start-count').innerText = `${this.state.apps.length} Apps`;
      },

      filterStartMenu(q) {
        this.renderStartMenu(q);
      },

      toggleStartMenu(e) {
        if (e) e.stopPropagation();
        const m = document.getElementById('start-menu');
        m.classList.toggle('hidden');
        document.getElementById('context-menu').classList.add('hidden');
      },

      closePopups() {
        document.getElementById('start-menu').classList.add('hidden');
        document.getElementById('context-menu').classList.add('hidden');
      },

      openContextMenu(e) {
        e.preventDefault();
        const m = document.getElementById('context-menu');
        const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 10;
        const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 10;
        m.style.left = `${Math.min(window.innerWidth - 220, clientX)}px`;
        m.style.top = `${Math.min(window.innerHeight - 240, clientY)}px`;
        m.classList.remove('hidden');
      },

      openApp(appId) {
        this.playChime('chime');

        if (this.state.windows[appId]) {
          this.bringToFront(appId);
          if (this.state.windows[appId].minimized) {
            this.state.windows[appId].minimized = false;
            const el = document.getElementById(`win-${appId}`);
            if (el) el.classList.remove('hidden');
          }
          this.updateTaskbar();
          return;
        }

        const app = this.state.apps.find(a => a.id === appId);
        if (!app) return;

        // Mobile, Tablet and iPad viewport logic
        const isMobileOrTablet = window.innerWidth < 850;
        const initialW = isMobileOrTablet ? window.innerWidth : Math.min(window.innerWidth - 30, app.width || 620);
        const initialH = isMobileOrTablet ? window.innerHeight - 56 : Math.min(window.innerHeight - 70, app.height || 480);
        const cascade = (Object.keys(this.state.windows).length * 24) % 140;
        const initialX = isMobileOrTablet ? 0 : Math.max(10, Math.min(window.innerWidth - initialW - 20, 40 + cascade));
        const initialY = isMobileOrTablet ? 0 : Math.max(10, Math.min(window.innerHeight - initialH - 60, 20 + cascade));

        this.state.topZ++;
        this.state.windows[appId] = {
          x: initialX,
          y: initialY,
          width: initialW,
          height: initialH,
          maximized: isMobileOrTablet,
          minimized: false,
          zIndex: this.state.topZ
        };

        this.createWindowDOM(app);
        this.updateTaskbar();
      },

      createWindowDOM(app) {
        const container = document.getElementById('window-layer');
        const win = this.state.windows[app.id];

        const winEl = document.createElement('div');
        winEl.id = `win-${app.id}`;
        winEl.className = 'absolute pointer-events-auto flex flex-col rounded-2xl glass win-shadow overflow-hidden';
        winEl.style.left = `${win.x}px`;
        winEl.style.top = `${win.y}px`;
        winEl.style.width = `${win.width}px`;
        winEl.style.height = `${win.height}px`;
        winEl.style.zIndex = win.zIndex;
        winEl.onpointerdown = () => this.bringToFront(app.id);

        // Header Titlebar with Functional Back Button (◀ Back)
        const header = document.createElement('div');
        header.className = 'h-11 bg-slate-950/90 border-b border-white/10 flex items-center justify-between px-3 select-none shrink-0 touch-none';
        header.innerHTML = `
          <div class="flex items-center gap-2 truncate">
            <button onclick="WebDesk.handleAppBack('${app.id}')" class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 active:scale-90 text-xs text-brand-500 font-bold transition touch-manipulation" title="Back / Reset App">
              ◀ Back
            </button>
            <span class="text-base">${app.icon}</span>
            <span class="text-xs font-semibold text-slate-200 truncate">${app.name}</span>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button onclick="WebDesk.minimizeWindow('${app.id}')" class="w-8 h-8 rounded-lg hover:bg-white/10 active:scale-90 flex items-center justify-center text-slate-400 hover:text-white transition touch-manipulation">―</button>
            <button onclick="WebDesk.toggleMaximize('${app.id}')" class="w-8 h-8 rounded-lg hover:bg-white/10 active:scale-90 flex items-center justify-center text-slate-400 hover:text-white transition touch-manipulation">▢</button>
            <button onclick="WebDesk.closeWindow('${app.id}')" class="w-8 h-8 rounded-lg hover:bg-rose-500/30 active:scale-90 text-slate-400 hover:text-rose-400 flex items-center justify-center transition touch-manipulation">✕</button>
          </div>
        `;

        // Body Canvas
        const body = document.createElement('div');
        body.className = 'flex-1 overflow-hidden relative bg-slate-950/80 text-slate-100 flex flex-col';
        body.id = `body-${app.id}`;

        // 8-way Edge Resizer handles
        ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw'].forEach(dir => {
          const r = document.createElement('div');
          r.className = `resizer resizer-${dir}`;
          r.onpointerdown = (e) => this.startResize(e, app.id, dir);
          winEl.appendChild(r);
        });

        winEl.appendChild(header);
        winEl.appendChild(body);
        container.appendChild(winEl);

        this.setupDrag(winEl, header, app.id);
        app.render(body);
      },

      handleAppBack(appId) {
        this.playChime('chime');
        const body = document.getElementById(`body-${appId}`);
        if (!body) return;

        const iframe = body.querySelector('iframe');
        if (iframe && iframe.contentWindow) {
          try {
            iframe.contentWindow.history.back();
            this.notify('Navigated Back', 'Returned to previous browser history state.');
            return;
          } catch(e){}
        }

        const app = this.state.apps.find(a => a.id === appId);
        if (app) {
          body.innerHTML = '';
          app.render(body);
          this.notify(app.name, 'View restored to default screen.');
        }
      },

      setupDrag(winEl, header, appId) {
        let isDragging = false;
        let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

        const onPointerDown = (e) => {
          if (e.target.closest('button')) return;
          this.bringToFront(appId);
          if (this.state.windows[appId] && this.state.windows[appId].maximized && window.innerWidth < 850) {
            return; // Lock dragging when in full-screen phone mode
          }
          isDragging = true;
          startX = e.clientX || (e.touches && e.touches[0].clientX);
          startY = e.clientY || (e.touches && e.touches[0].clientY);
          initialLeft = winEl.offsetLeft;
          initialTop = winEl.offsetTop;

          try {
            if (header.setPointerCapture && e.pointerId) {
              header.setPointerCapture(e.pointerId);
            }
          } catch (err) {}
        };

        const onPointerMove = (e) => {
          if (!isDragging) return;
          const clientX = e.clientX || (e.touches && e.touches[0].clientX);
          const clientY = e.clientY || (e.touches && e.touches[0].clientY);
          if (clientX === undefined || clientY === undefined) return;

          const dx = clientX - startX;
          const dy = clientY - startY;

          const newX = Math.max(-winEl.offsetWidth + 80, Math.min(window.innerWidth - 60, initialLeft + dx));
          const newY = Math.max(0, Math.min(window.innerHeight - 60, initialTop + dy));

          winEl.style.left = `${newX}px`;
          winEl.style.top = `${newY}px`;

          if (this.state.windows[appId]) {
            this.state.windows[appId].x = newX;
            this.state.windows[appId].y = newY;
          }
        };

        const onPointerUp = (e) => {
          if (!isDragging) return;
          isDragging = false;
          try {
            if (header.releasePointerCapture && e.pointerId) {
              header.releasePointerCapture(e.pointerId);
            }
          } catch (err) {}
        };

        header.addEventListener('pointerdown', onPointerDown);
        header.addEventListener('pointermove', onPointerMove);
        header.addEventListener('pointerup', onPointerUp);
        header.addEventListener('pointercancel', onPointerUp);

        // Fallbacks for older touch engines
        header.addEventListener('touchstart', onPointerDown, { passive: false });
        header.addEventListener('touchmove', onPointerMove, { passive: false });
        header.addEventListener('touchend', onPointerUp, { passive: false });
      },

      startResize(e, appId, dir) {
        e.preventDefault();
        e.stopPropagation();
        this.bringToFront(appId);

        const winEl = document.getElementById(`win-${appId}`);
        if (!winEl) return;

        const startX = e.clientX || (e.touches && e.touches[0].clientX);
        const startY = e.clientY || (e.touches && e.touches[0].clientY);
        const startW = winEl.offsetWidth;
        const startH = winEl.offsetHeight;
        const startL = winEl.offsetLeft;
        const startT = winEl.offsetTop;

        const onMove = (ev) => {
          const clientX = ev.clientX || (ev.touches && ev.touches[0].clientX);
          const clientY = ev.clientY || (ev.touches && ev.touches[0].clientY);
          if (clientX === undefined || clientY === undefined) return;

          const dx = clientX - startX;
          const dy = clientY - startY;
          let newW = startW, newH = startH, newX = startL, newY = startT;
          const minW = 280, minH = 180;

          if (dir.includes('e')) newW = Math.max(minW, startW + dx);
          if (dir.includes('s')) newH = Math.max(minH, startH + dy);
          if (dir.includes('w')) {
            if (startW - dx > minW) { newW = startW - dx; newX = startL + dx; }
          }
          if (dir.includes('n')) {
            if (startH - dy > minH) { newH = startH - dy; newY = startT + dy; }
          }

          winEl.style.width = `${newW}px`;
          winEl.style.height = `${newH}px`;
          winEl.style.left = `${newX}px`;
          winEl.style.top = `${newY}px`;

          if (this.state.windows[appId]) {
            this.state.windows[appId].width = newW;
            this.state.windows[appId].height = newH;
            this.state.windows[appId].x = newX;
            this.state.windows[appId].y = newY;
          }
        };

        const onUp = () => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          window.removeEventListener('touchmove', onMove);
          window.removeEventListener('touchend', onUp);
        };

        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onUp, { passive: false });
      },

      bringToFront(appId) {
        if (!this.state.windows[appId]) return;
        this.state.topZ++;
        this.state.windows[appId].zIndex = this.state.topZ;
        const el = document.getElementById(`win-${appId}`);
        if (el) el.style.zIndex = this.state.topZ;
        this.updateTaskbar();
      },

      closeWindow(appId) {
        const el = document.getElementById(`win-${appId}`);
        if (el) el.remove();
        delete this.state.windows[appId];
        this.updateTaskbar();
      },

      minimizeWindow(appId) {
        const win = this.state.windows[appId];
        if (!win) return;
        win.minimized = true;
        const el = document.getElementById(`win-${appId}`);
        if (el) el.classList.add('hidden');
        this.updateTaskbar();
      },

      toggleMaximize(appId) {
        const win = this.state.windows[appId];
        const winEl = document.getElementById(`win-${appId}`);
        if (!win || !winEl) return;

        if (!win.maximized) {
          win.oldX = win.x; win.oldY = win.y; win.oldW = win.width; win.oldH = win.height;
          win.x = 0; win.y = 0; win.width = window.innerWidth; win.height = window.innerHeight - 56;
          win.maximized = true;
        } else {
          win.x = win.oldX || 30; win.y = win.oldY || 30; win.width = win.oldW || 620; win.height = win.oldH || 480;
          win.maximized = false;
        }

        winEl.style.left = `${win.x}px`;
        winEl.style.top = `${win.y}px`;
        winEl.style.width = `${win.width}px`;
        winEl.style.height = `${win.height}px`;
        this.bringToFront(appId);
      },

      updateTaskbar() {
        const bar = document.getElementById('taskbar-tabs');
        bar.innerHTML = '';

        Object.keys(this.state.windows).forEach(appId => {
          const app = this.state.apps.find(a => a.id === appId);
          const win = this.state.windows[appId];
          if (!app) return;

          const isFocused = win.zIndex === this.state.topZ && !win.minimized;
          const tab = document.createElement('button');
          tab.className = `flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-medium transition active:scale-90 touch-manipulation ${
            isFocused ? 'bg-white/20 text-white shadow' : 'bg-white/5 text-slate-400 hover:bg-white/10'
          }`;
          tab.onclick = () => {
            if (win.minimized) {
              win.minimized = false;
              document.getElementById(`win-${appId}`).classList.remove('hidden');
              this.bringToFront(appId);
            } else if (isFocused) {
              this.minimizeWindow(appId);
            } else {
              this.bringToFront(appId);
            }
          };
          tab.innerHTML = `<span>${app.icon}</span><span class="truncate max-w-[85px] hidden sm:inline">${app.name}</span>`;
          bar.appendChild(tab);
        });
      },

                </div>

              </div>
              <canvas id="pt-cv" class="flex-1 bg-slate-900 touch-none w-full h-full"></canvas>
            </div>
          `;
          const cv = el.querySelector('#pt-cv');
          const ctx = cv.getContext('2d');
          
          setTimeout(() => {
            cv.width = cv.parentElement.clientWidth;
            cv.height = cv.parentElement.clientHeight - 40;
          }, 100);

          let drawing = false;
          const getPos = (e) => {
            const r = cv.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return { x: clientX - r.left, y: clientY - r.top };
          };

          const start = (e) => { drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); };
          const stop = () => { drawing = false; };
          const draw = (e) => {
            if (!drawing) return;
            e.preventDefault();
            const p = getPos(e);
            ctx.lineWidth = el.querySelector('#pt-sz').value;
            ctx.strokeStyle = el.querySelector('#pt-col').value;
            ctx.lineCap = 'round';
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
          };

          cv.addEventListener('pointerdown', start);
          cv.addEventListener('pointermove', draw);
          cv.addEventListener('pointerup', stop);
          cv.addEventListener('touchstart', start, { passive: false });
          cv.addEventListener('touchmove', draw, { passive: false });
          cv.addEventListener('touchend', stop);

          el.querySelector('#pt-clr').onclick = () => ctx.clearRect(0, 0, cv.width, cv.height);
        },

            </div>
          `;
        },

        weather(el) {
          el.innerHTML = `
            <div class="flex flex-col h-full items-center justify-center p-6 text-center text-xs">
              <div class="text-5xl mb-2">⛅</div>
              <div class="text-2xl font-bold text-white">24°C</div>
              <div class="text-slate-400 text-sm">Partly Cloudy</div>
              <div class="mt-4 grid grid-cols-3 gap-3 text-[11px] text-slate-300">
                <div class="p-2 rounded-xl bg-slate-900">Humidity<br><b class="text-white">62%</b></div>
                <div class="p-2 rounded-xl bg-slate-900">Wind<br><b class="text-white">14 km/h</b></div>
                <div class="p-2 rounded-xl bg-slate-900">Precip<br><b class="text-white">5%</b></div>
              </div>
            </div>
          `;
        },

        habits(el) {
          let list = JSON.parse(localStorage.getItem('wd_habits_data') || '[]');
          el.innerHTML = `
            <div class="flex flex-col h-full p-3 text-xs">
              <div class="flex gap-2 mb-3">
                <input id="hb-in" placeholder="New daily routine..." class="flex-1 bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-white">
                <button id="hb-btn" class="px-4 py-2 bg-brand-600 rounded-xl font-bold text-white active:scale-95 touch-manipulation">Add</button>
              </div>
              <div class="flex-1 overflow-y-auto space-y-1.5" id="hb-list"></div>
            </div>
          `;
          const l = el.querySelector('#hb-list');
          const draw = () => {
            l.innerHTML = '';
            list.forEach(h => {
              const r = document.createElement('div');
              r.className = 'p-2.5 rounded-xl bg-slate-900 border border-white/5 flex justify-between items-center';
              r.innerHTML = `<span class="text-white">${h.name}</span><button class="px-3 py-1.5 rounded-lg bg-emerald-600/30 text-emerald-300 font-bold active:scale-95 touch-manipulation">${h.streak || 1}d streak ✓</button>`;
              r.querySelector('button').onclick = () => { h.streak = (h.streak || 1) + 1; save(); };
              l.appendChild(r);
            });
          };
          const save = () => {
            localStorage.setItem('wd_habits_data', JSON.stringify(list));
            draw();
          };
          el.querySelector('#hb-btn').onclick = () => {
            const v = el.querySelector('#hb-in').value.trim();
            if (v) {
              list.push({ name: v, streak: 1 });
              el.querySelector('#hb-in').value = '';
              save();
            }
          };
          draw();
        },

        expenses(el) {
          let items = JSON.parse(localStorage.getItem('wd_expenses_data') || '[]');
          el.innerHTML = `
            <div class="flex flex-col h-full p-3 text-xs">
              <div class="flex gap-2 mb-3">
                <input id="ex-n" placeholder="Item..." class="flex-1 bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-white">
                <input id="ex-v" type="number" placeholder="$" class="w-20 bg-slate-900 border border-white/10 rounded-xl px-2 text-white">
                <button id="ex-btn" class="px-4 py-2 bg-emerald-600 rounded-xl font-bold text-white active:scale-95 touch-manipulation">Add</button>
              </div>
              <div class="flex-1 overflow-y-auto space-y-1.5" id="ex-list"></div>
            </div>
          `;
          const l = el.querySelector('#ex-list');
          const draw = () => {
            l.innerHTML = '';
            items.forEach(x => {
              const r = document.createElement('div');
              r.className = 'p-2.5 rounded-xl bg-slate-900 border border-white/5 flex justify-between';
              r.innerHTML = `<span class="text-white">${x.name}</span><span class="text-rose-400 font-mono">-$${x.val}</span>`;
              l.appendChild(r);
            });
          };
          el.querySelector('#ex-btn').onclick = () => {
            const n = el.querySelector('#ex-n').value.trim();
            const v = el.querySelector('#ex-v').value;
            if (n && v) {
              items.push({ name: n, val: v });
              localStorage.setItem('wd_expenses_data', JSON.stringify(items));
              draw();
            }
          };
          draw();
        },

        vault(el) {
          el.innerHTML = `
            <div class="flex flex-col h-full p-4 text-xs space-y-4">
              <div class="font-bold text-sm text-white">Cryptographic Key Generator</div>
              <div id="vt-pass" class="p-3.5 bg-slate-950 rounded-xl font-mono text-emerald-400 text-center font-bold text-sm select-all">Click Generate</div>
              <button id="vt-btn" class="w-full py-3 bg-brand-600 rounded-xl font-bold text-white active:scale-95 touch-manipulation">Generate High-Entropy Key</button>
            </div>
          `;
          el.querySelector('#vt-btn').onclick = () => {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=';
            let res = '';
            for (let i = 0; i < 20; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
            el.querySelector('#vt-pass').innerText = res;
          };
        },

        worldclock(el) {
          el.innerHTML = `
            <div class="flex flex-col h-full p-4 text-xs space-y-3">
              <div class="font-bold text-sm text-white mb-1">Global Commercial Hubs</div>
              <div class="p-3 bg-slate-900 rounded-2xl flex justify-between"><span>New York (EST)</span><b class="font-mono text-white">${new Date().toLocaleTimeString('en-US', { timeZone: 'America/New_York' })}</b></div>
              <div class="p-3 bg-slate-900 rounded-2xl flex justify-between"><span>London (GMT)</span><b class="font-mono text-white">${new Date().toLocaleTimeString('en-US', { timeZone: 'Europe/London' })}</b></div>
              <div class="p-3 bg-slate-900 rounded-2xl flex justify-between"><span>Tokyo (JST)</span><b class="font-mono text-white">${new Date().toLocaleTimeString('en-US', { timeZone: 'Asia/Tokyo' })}</b></div>
            </div>
          `;
        },

        uploader(el) {
          el.innerHTML = `
            <div class="flex flex-col h-full p-4 overflow-y-auto space-y-4 text-xs">
              <div class="bg-slate-900/80 p-4 rounded-2xl border border-white/10 space-y-3">
                <div class="font-bold text-sm text-emerald-400">Install Custom App via Code</div>
                <div class="grid grid-cols-2 gap-2">
                  <input id="up-t" placeholder="Application Title" class="bg-slate-950 border border-white/10 rounded-xl px-3 py-2 text-white">
                  <input id="up-i" placeholder="Emoji Icon (e.g. 🚀)" class="bg-slate-950 border border-white/10 rounded-xl px-3 py-2 text-white">
                </div>
                <input type="file" id="up-f" accept=".html,.js,.txt" class="text-slate-400 text-xs" />
                <textarea id="up-c" placeholder="<html><body>Hello World</body></html>" class="w-full bg-slate-950 border border-white/10 rounded-xl p-3 h-20 text-white font-mono text-[11px]"></textarea>
                <button id="up-inst" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-white transition active:scale-95 touch-manipulation">Install App</button>
              </div>
            </div>
          `;
          const fileIn = el.querySelector('#up-f');
          const codeArea = el.querySelector('#up-c');
          fileIn.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
              const r = new FileReader();
              r.onload = ev => { codeArea.value = ev.target.result; };
              r.readAsText(file);
            }
          };
          el.querySelector('#up-inst').onclick = () => {
            const title = el.querySelector('#up-t').value.trim() || 'Custom App';
            const icon = el.querySelector('#up-i').value.trim() || '⚡';
            const code = codeArea.value.trim();
            if (!code) { alert('Please provide code.'); return; }

            const customApps = JSON.parse(localStorage.getItem('webdesk_custom_apps') || '[]');
            const newApp = { id: `app_${Date.now()}`, name: title, icon, code };
            customApps.push(newApp);
            localStorage.setItem('webdesk_custom_apps', JSON.stringify(customApps));

            WebDesk.registerApplications();
            WebDesk.renderDesktopIcons();
            WebDesk.renderStartMenu();
            WebDesk.notify('App Installed', `${title} placed on desktop.`);
            WebDesk.openApp(newApp.id);
          };
        },

        settings(el) {
          el.innerHTML = `
            <div class="flex flex-col h-full p-4 overflow-y-auto space-y-4 text-xs">
              <div class="bg-slate-900/80 p-4 rounded-2xl border border-white/10 space-y-2.5">
                <div class="font-bold text-sm text-brand-500">Google Apps Script Webhook Sync</div>
                <input id="st-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="${WebDesk.state.sysConfig.webhookUrl}" class="w-full bg-slate-950 border border-white/10 rounded-xl px-3 py-2 text-white font-mono text-[11px]">
                <div class="flex gap-2">
                  <button id="st-save-url" class="px-4 py-2.5 bg-brand-600 rounded-xl font-bold text-white active:scale-95 touch-manipulation">Save URL</button>
                  <button onclick="WebDesk.syncAll()" class="px-4 py-2.5 bg-emerald-600/30 text-emerald-300 rounded-xl font-bold active:scale-95 touch-manipulation">Sync Now</button>
                </div>
              </div>

              <div class="bg-slate-900/80 p-4 rounded-2xl border border-white/10 space-y-2.5">
                <div class="font-bold text-sm text-purple-400">Master Password</div>
                <div class="grid grid-cols-2 gap-2">
                  <input id="st-p-old" type="password" placeholder="Current" class="bg-slate-950 border border-white/10 rounded-xl px-3 py-2 text-white">
                  <input id="st-p-new" type="password" placeholder="New Password" class="bg-slate-950 border border-white/10 rounded-xl px-3 py-2 text-white">
                </div>
                <button id="st-save-pwd" class="px-4 py-2.5 bg-purple-600 rounded-xl font-bold text-white active:scale-95 touch-manipulation">Change Key</button>
              </div>

              <div class="bg-slate-900/80 p-4 rounded-2xl border border-white/10 space-y-2.5">
                <div class="font-bold text-sm text-white">Desktop Appearance Themes</div>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  <button onclick="WebDesk.setTheme('default')" class="p-3 rounded-xl bg-slate-950 border border-white/10 text-white font-bold active:scale-95 touch-manipulation">Deep Aurora</button>
                  <button onclick="WebDesk.setTheme('cyberpunk')" class="p-3 rounded-xl bg-[#1a052e] border border-rose-500/30 text-rose-400 font-bold active:scale-95 touch-manipulation">Cyberpunk</button>
                  <button onclick="WebDesk.setTheme('acrylic')" class="p-3 rounded-xl bg-slate-800 border border-white/10 text-cyan-400 font-bold active:scale-95 touch-manipulation">Mac Acrylic</button>
                  <button onclick="WebDesk.setTheme('clean')" class="p-3 rounded-xl bg-slate-900 border border-emerald-500/30 text-emerald-400 font-bold active:scale-95 touch-manipulation">Clean Slate</button>
                </div>
              </div>
            </div>
          `;

          el.querySelector('#st-save-url').onclick = () => {
            const u = el.querySelector('#st-url').value.trim();
            localStorage.setItem('webdesk_sync_url', u);
            WebDesk.state.sysConfig.webhookUrl = u;
            WebDesk.notify('Settings', 'Webhook URL updated.');
          };

          el.querySelector('#st-save-pwd').onclick = async () => {
            const oldP = el.querySelector('#st-p-old').value;
            const newP = el.querySelector('#st-p-new').value;
            const h = await WebDesk.sha256(oldP);
            const currentH = localStorage.getItem('webdesk_pwd_hash') || WebDesk.state.masterHash;
            if (h === currentH && newP.length >= 4) {
              const newHash = await WebDesk.sha256(newP);
              localStorage.setItem('webdesk_pwd_hash', newHash);
              WebDesk.notify('Security Updated', 'Master key changed successfully.');
            } else {
              alert('Current password incorrect or new password too short.');
            }
          };
        },

        spec(el) {
          el.innerHTML = `
            <div class="flex flex-col h-full p-4 overflow-y-auto text-xs space-y-3 font-mono">
              <div class="font-bold text-sm text-brand-500">Requirements Traceability Matrix (RTM)</div>
              <div class="p-3 bg-slate-900 rounded-xl border border-white/10 space-y-1">
                <div class="text-white font-bold">REQ-01: Single User Access</div>
                <div class="text-slate-400">Verified via SHA-256 Web Cryptography API lock screen.</div>
              </div>
              <div class="p-3 bg-slate-900 rounded-xl border border-white/10 space-y-1">
                <div class="text-white font-bold">REQ-02: Full Agnosticism</div>
                <div class="text-slate-400">Touch, Pointer and Mouse parity with fluid window dragging & resizing.</div>
              </div>
              <div class="p-3 bg-slate-900 rounded-xl border border-white/10 space-y-1">
                <div class="text-white font-bold">REQ-03: Zero Click Deadlocks</div>
                <div class="text-slate-400">Layer boundaries separated; pointer-events: auto on all interactive elements.</div>
              </div>
              <div class="p-3 bg-slate-900 rounded-xl border border-white/10 space-y-1">
                <div class="text-white font-bold">REQ-04: 30+ Core Operational Apps</div>
                <div class="text-slate-400">All 30 core applications fully implemented with state persistence.</div>
              </div>
            </div>
          `;
        }
      },

      calcKey(k) {
        const d = document.getElementById('cl-disp');
        if (!d) return;
        if (k === 'C') d.value = '0';
        else if (k === '=') {
          try { d.value = eval(d.value); } catch(e) { d.value = 'Error'; }
        } else {
          d.value = d.value === '0' ? k : d.value + k;
        }
      },

      renderWidgets() {
        const container = document.getElementById('desktop-widgets');
        if (!container) return;
        container.innerHTML = '';

        const clock = document.createElement('div');
        clock.className = 'glass rounded-3xl p-4 win-shadow border border-white/10 w-60 text-xs relative group';
        clock.innerHTML = `
          <button onclick="this.parentElement.remove()" class="absolute top-2 right-2 text-slate-500 hover:text-rose-400 p-1.5 touch-manipulation">✕</button>
          <div class="text-slate-400 font-bold uppercase text-[10px] mb-1">Live Clock</div>
          <div id="w-clk-time" class="text-2xl font-bold font-mono text-white">12:00:00 PM</div>
          <div id="w-clk-date" class="text-slate-400 text-[11px]">Sep 21, 2026</div>
        `;
        container.appendChild(clock);

        const noteVal = localStorage.getItem('wd_widget_note') || 'Sticky desktop note...';
        const note = document.createElement('div');
        note.className = 'glass rounded-3xl p-4 win-shadow border border-white/10 w-60 text-xs flex flex-col relative';
        note.innerHTML = `
          <button onclick="this.parentElement.remove()" class="absolute top-2 right-2 text-slate-500 hover:text-rose-400 p-1.5 touch-manipulation">✕</button>
          <div class="text-amber-400 font-bold uppercase text-[10px] mb-1">Sticky Note</div>
          <textarea id="w-note-tx" class="bg-transparent text-amber-200 text-xs resize-none focus:outline-none h-16 leading-relaxed">${noteVal}</textarea>
        `;
        container.appendChild(note);
        note.querySelector('#w-note-tx').oninput = (e) => {
          localStorage.setItem('wd_widget_note', e.target.value);
        };
      },

      addStickyWidget() {
        this.renderWidgets();
      },

      setTheme(t) {
        document.body.className = `h-full w-full text-slate-100 flex flex-col justify-between select-none relative overflow-hidden font-sans theme-${t}`;
        this.state.sysConfig.theme = t;
      },

      downloadFile(name, text) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
        a.download = name;
        a.click();
      },

      async syncAll() {
        const ind = document.getElementById('sync-indicator');
        const txt = document.getElementById('sync-text');
        if (ind) ind.className = 'w-2 h-2 rounded-full bg-amber-400 animate-ping';
        if (txt) txt.innerText = 'Syncing...';

        const payload = {
          action: 'sync_data',
          timestamp: new Date().toISOString(),
          applications: {
            todo: localStorage.getItem('wd_todo_data'),
            notes: localStorage.getItem('wd_notes_data'),
            sheets: localStorage.getItem('wd_sheets_data'),
            contacts: localStorage.getItem('wd_contacts_data'),
            habits: localStorage.getItem('wd_habits_data'),
            expenses: localStorage.getItem('wd_expenses_data')
          }
        };

        if (this.state.sysConfig.webhookUrl) {
          try {
            await fetch(this.state.sysConfig.webhookUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            this.notify('Cloud Synchronized', 'Records synced with Google Sheets.');
          } catch(e) {
            console.warn('Sync fallback', e);
          }
        }

        setTimeout(() => {
          if (ind) ind.className = 'w-2 h-2 rounded-full bg-emerald-400';
          if (txt) txt.innerText = this.state.sysConfig.webhookUrl ? 'Cloud Synced' : 'Local Cached';
        }, 600);
      },

      startClock() {
        const tick = () => {
          const d = new Date();
          const tStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const dStr = d.toLocaleDateString([], { month: 'short', day: 'numeric' });
          document.getElementById('tray-time').innerText = tStr;
          document.getElementById('tray-date').innerText = dStr;

          const wt = document.getElementById('w-clk-time');
          const wd = document.getElementById('w-clk-date');
          if (wt) wt.innerText = d.toLocaleTimeString();
          if (wd) wd.innerText = d.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
        };
        tick();
        setInterval(tick, 1000);
      },

      init() {
        this.registerApplications();
        this.renderDesktopIcons();
        this.renderStartMenu();
        this.renderWidgets();
        this.startClock();

        document.getElementById('lock-pass-input').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') this.unlockOS();
        });

        document.getElementById('desktop-workspace').addEventListener('click', () => {
          this.closePopups();
        });

        // Touch event to unlock Web Audio on mobile/tablet without restrictions
        window.addEventListener('touchstart', () => {
          this.getAudioContext();
        }, { once: true });

        if ('serviceWorker' in navigator) {
          const swCode = `
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('activate', e => self.clients.claim());
            self.addEventListener('fetch', e => {});
          `;
          const blob = new Blob([swCode], { type: 'application/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        }
      }
    };

    window.addEventListener('DOMContentLoaded', () => WebDesk.init());
  </script>
</body>
</html>

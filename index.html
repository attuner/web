<!DOCTYPE html>
<html lang="en" class="h-full w-full select-none overflow-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WebDesk Ultra OS v5.0</title>

  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"WebDesk Ultra OS","short_name":"WebDesk","start_url":".","display":"standalone","background_color":"#0b0f19","theme_color":"#0f172a","icons":[{"src":"https://placehold.co/192x192/0ea5e9/ffffff?text=WD5","sizes":"192x192","type":"image/png"}]}' />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' },
            osdark: '#070b14',
            oscard: 'rgba(15, 23, 42, 0.88)'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['Fira Code', 'JetBrains Mono', 'Courier New', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --wallpaper: radial-gradient(at 0% 0%, #1e1b4b 0, transparent 60%), radial-gradient(at 100% 0%, #0369a1 0, transparent 55%), radial-gradient(at 50% 100%, #0f172a 0, #020617 100%);
      --glass-bg: rgba(15, 23, 42, 0.90);
      --glass-border: rgba(255, 255, 255, 0.14);
      --accent: #0ea5e9;
      --accent-hover: #38bdf8;
      --header-bg: rgba(10, 15, 29, 0.95);
    }
    .theme-cyberpunk {
      --wallpaper: linear-gradient(135deg, #090212 0%, #290833 45%, #00222e 100%);
      --glass-bg: rgba(28, 8, 43, 0.92);
      --glass-border: rgba(244, 63, 94, 0.35);
      --accent: #f43f5e;
      --accent-hover: #fb7185;
      --header-bg: rgba(20, 5, 30, 0.95);
    }
    .theme-acrylic {
      --wallpaper: radial-gradient(circle at 50% 50%, #1e293b, #0f172a, #020617);
      --glass-bg: rgba(30, 41, 59, 0.85);
      --glass-border: rgba(255, 255, 255, 0.22);
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --header-bg: rgba(15, 23, 42, 0.95);
    }
    .theme-clean {
      --wallpaper: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #090d16 100%);
      --glass-bg: rgba(15, 23, 42, 0.94);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent: #10b981;
      --accent-hover: #34d399;
      --header-bg: rgba(11, 17, 32, 0.95);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      height: -webkit-fill-available;
      height: 100dvh;
    }

    body {
      background: var(--wallpaper);
      background-size: cover;
      background-position: center;
      overscroll-behavior: none;
      touch-action: manipulation;
      pointer-events: auto !important;
      position: fixed;
      inset: 0;
      width: 100vw;
    }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
    }

    .win-shadow {
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    /* 8-Directional Edge Resizers with Touch-Friendly Grips */
    .resizer { position: absolute; z-index: 50; touch-action: none; }
    .resizer-n { top: -10px; left: 15px; right: 15px; height: 22px; cursor: n-resize; }
    .resizer-s { bottom: -10px; left: 15px; right: 15px; height: 22px; cursor: s-resize; }
    .resizer-e { top: 15px; bottom: 15px; right: -10px; width: 22px; cursor: e-resize; }
    .resizer-w { top: 15px; bottom: 15px; left: -10px; width: 22px; cursor: w-resize; }
    .resizer-ne { top: -12px; right: -12px; width: 30px; height: 30px; cursor: ne-resize; }
    .resizer-nw { top: -12px; left: -12px; width: 30px; height: 30px; cursor: nw-resize; }
    .resizer-se { bottom: -12px; right: -12px; width: 30px; height: 30px; cursor: se-resize; }
    .resizer-sw { bottom: -12px; left: -12px; width: 30px; height: 30px; cursor: sw-resize; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.22); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.45); }

    input, textarea, button, select {
      user-select: auto;
      -webkit-user-select: auto;
    }

    #desktop-grid {
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }

    .dragging-icon {
      opacity: 0.5;
      transform: scale(0.92);
    }
  </style>
</head>
<body class="h-full w-full text-slate-100 flex flex-col justify-between select-none relative overflow-hidden font-sans" oncontextmenu="WebDesk.openContextMenu(event)">

  <!-- BACKGROUND DECORATOR -->
  <div id="desktop-bg" class="absolute inset-0 pointer-events-none z-0"></div>

  <!-- FULLSCREEN SECURITY & LOCK SCREEN BARRIER -->
  <div id="lock-screen" class="fixed inset-0 z-[100000] flex flex-col items-center justify-center p-4 bg-slate-950/95 backdrop-blur-3xl transition-opacity duration-300 pointer-events-auto">
    <div class="glass rounded-3xl p-8 max-w-sm w-full win-shadow text-center flex flex-col items-center border border-white/20">
      <div class="w-16 h-16 rounded-2xl bg-brand-500/20 border border-brand-500/30 flex items-center justify-center text-brand-500 mb-4 shadow-lg text-2xl">
        🔐
      </div>
      <h1 class="text-xl font-bold tracking-tight text-white mb-1">WebDesk Ultra OS v5.0</h1>
      <p class="text-xs text-slate-400 mb-5">Single-User Secure Cloud Workstation</p>
      <div class="w-full space-y-2.5">
        <input type="password" id="lock-pass-input" placeholder="Enter master password..." class="w-full bg-slate-900 border border-white/15 rounded-xl px-4 py-2.5 text-sm text-center text-white focus:outline-none focus:border-brand-500 font-mono tracking-wider" onkeydown="if(event.key==='Enter') WebDesk.unlockOS()" />
        <button onclick="WebDesk.unlockOS()" class="w-full py-3 bg-brand-600 hover:bg-brand-500 active:scale-95 text-xs font-semibold rounded-xl text-white shadow-lg transition touch-manipulation">Unlock Workstation</button>
        <div id="lock-err" class="text-xs text-rose-400 font-medium h-4"></div>
      </div>
      <div class="mt-4 pt-3 border-t border-white/10 w-full text-[11px] text-slate-400 flex justify-between">
        <span>Default: <code class="text-brand-500 font-mono">admin123</code></span>
        <button onclick="WebDesk.resetPasswordFallback()" class="text-amber-400 hover:underline p-1">Reset</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" class="fixed top-4 right-4 z-[99999] flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <!-- MAIN DESKTOP WORKSPACE -->
  <div id="desktop-workspace" class="relative flex-1 w-full overflow-hidden flex flex-col md:flex-row p-3 md:p-5 gap-4 pointer-events-auto z-10" onclick="WebDesk.closePopups()">
    <!-- DESKTOP APP ICONS GRID (Rearrangeable Shortcuts) -->
    <main id="desktop-grid" class="relative grid grid-cols-4 sm:grid-cols-6 md:grid-cols-5 lg:grid-cols-7 gap-2.5 sm:gap-3 w-full md:w-max h-full overflow-y-auto pr-1 md:pr-3 pointer-events-auto select-none">
      <!-- Dynamically Populated with drag-reorder -->
    </main>

    <!-- DRAGGABLE / REARRANGEABLE DESKTOP WIDGETS -->
    <aside id="desktop-widgets" class="hidden lg:flex relative flex-1 flex-wrap content-start gap-3.5 p-1 overflow-y-auto max-w-full pointer-events-auto">
      <!-- Dynamically Populated -->
    </aside>
  </div>

  <!-- FLOATING MULTI-WINDOW LAYER -->
  <div id="window-layer" class="absolute inset-0 pointer-events-none z-20 overflow-hidden">
    <!-- Active App Windows are injected here -->
  </div>

  <!-- DOCK / TASKBAR -->
  <footer id="taskbar" class="relative z-40 h-14 glass border-t border-white/10 px-3 flex items-center justify-between shadow-2xl pointer-events-auto">
    <div class="flex items-center gap-2">
      <!-- Start Menu Trigger -->
      <button id="btn-start" onclick="WebDesk.toggleStartMenu(event)" class="w-11 h-11 rounded-xl bg-brand-500/20 hover:bg-brand-500/35 active:scale-90 flex items-center justify-center border border-brand-500/30 text-brand-500 font-bold transition text-lg touch-manipulation" title="Start Menu">
        ❖
      </button>

      <!-- Web Browser Fast Access -->
      <button onclick="WebDesk.openApp('browser')" class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-blue-500/20 hover:bg-blue-500/30 border border-blue-500/30 text-blue-300 text-xs font-semibold transition active:scale-95 touch-manipulation" title="WebSurfer Pro Browser">
        <span>🌐</span>
        <span class="hidden sm:inline">Browser</span>
      </button>

      <!-- URL PWA Installer Trigger -->
      <button onclick="WebDesk.openApp('pwainstall')" class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-500/30 text-cyan-300 text-xs font-semibold transition active:scale-95 touch-manipulation">
        <span>+</span>
        <span class="hidden sm:inline">Install PWA</span>
      </button>

      <div class="h-6 w-px bg-white/10 mx-1"></div>

      <!-- Dock Window Tabs -->
      <div id="taskbar-tabs" class="flex items-center gap-1.5 overflow-x-auto max-w-[35vw] sm:max-w-[48vw]"></div>
    </div>

    <!-- Right System Tray -->
    <div class="flex items-center gap-2 text-xs text-slate-300">
      <!-- Cloud Sync Pill -->
      <div onclick="WebDesk.openApp('settings')" class="cursor-pointer flex items-center gap-1.5 bg-white/5 hover:bg-white/10 px-2.5 py-1.5 rounded-xl border border-white/10" title="Google Cloud Sheets & Drive Status">
        <span id="sync-indicator" class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span id="sync-text" class="hidden md:inline text-[11px] font-mono">Sync Ready</span>
      </div>

      <!-- Live Clock & Date -->
      <div class="text-right px-2.5 py-1 rounded-xl bg-white/5 border border-white/5 cursor-pointer" onclick="WebDesk.openApp('calendar')">
        <div id="tray-time" class="font-bold text-slate-100 text-xs">12:00 PM</div>
        <div id="tray-date" class="text-[10px] text-slate-400">Sep 21</div>
      </div>

      <!-- Lock Workstation Button -->
      <button onclick="WebDesk.lockOS()" class="p-2 rounded-xl hover:bg-rose-500/20 text-slate-400 hover:text-rose-300 transition active:scale-90" title="Lock Desktop">
        🔒
      </button>
    </div>
  </footer>

  <!-- START MENU -->
  <div id="start-menu" class="hidden absolute bottom-16 left-3 w-80 sm:w-96 glass rounded-3xl p-4 z-50 win-shadow border border-white/15 pointer-events-auto">
    <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-3">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-brand-600 text-white flex items-center justify-center font-bold text-sm">W</div>
        <div>
          <div class="font-bold text-sm text-white">WebDesk Ultra OS</div>
          <div class="text-[10px] text-slate-400">Single-User Cloud Workstation</div>
        </div>
      </div>
      <span id="start-count" class="text-[10px] font-mono bg-white/10 px-2 py-0.5 rounded-full">Apps</span>
    </div>
    <input type="text" id="start-search" oninput="WebDesk.filterStartMenu(this.value)" placeholder="Search applications..." class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white mb-3 focus:outline-none focus:border-brand-500" />
    <div id="start-list" class="max-h-72 overflow-y-auto space-y-1 pr-1"></div>
    <div class="mt-3 pt-2.5 border-t border-white/10 flex justify-between text-xs text-slate-400">
      <button onclick="WebDesk.openApp('appmanager'); WebDesk.closePopups();" class="text-cyan-400 hover:underline">Manage & Uninstall Apps</button>
      <button onclick="WebDesk.openApp('codevault'); WebDesk.closePopups();" class="text-amber-300 hover:underline">&lt;/&gt; Code Vault</button>
      <button onclick="WebDesk.openApp('settings'); WebDesk.closePopups();" class="hover:text-white">Settings</button>
    </div>
  </div>

  <!-- CONTEXT MENU -->
  <div id="context-menu" class="hidden fixed z-50 w-56 glass rounded-2xl py-1 text-xs text-slate-200 win-shadow border border-white/15 pointer-events-auto">
    <button onclick="WebDesk.openApp('browser'); WebDesk.closePopups();" class="w-full text-left px-3 py-2 hover:bg-white/10 flex items-center gap-2 text-blue-300"><span>🌐</span> Open WebSurfer Browser</button>
    <button onclick="WebDesk.openApp('pwainstall'); WebDesk.closePopups();" class="w-full text-left px-3 py-2 hover:bg-white/10 flex items-center gap-2 text-cyan-300"><span>🔗</span> Install PWA via URL</button>
    <button onclick="WebDesk.openApp('uploader'); WebDesk.closePopups();" class="w-full text-left px-3 py-2 hover:bg-white/10 flex items-center gap-2"><span>📦</span> Upload Custom App Code</button>
    <button onclick="WebDesk.openApp('appmanager'); WebDesk.closePopups();" class="w-full text-left px-3 py-2 hover:bg-white/10 flex items-center gap-2 text-amber-300"><span>⚙️</span> Uninstall / Hide Apps</button>
    <button onclick="WebDesk.openApp('codevault'); WebDesk.closePopups();" class="w-full text-left px-3 py-2 hover:bg-white/10 flex items-center gap-2 text-emerald-300"><span>📋</span> Copy Code.gs / Manifest</button>
    <div class="h-px bg-white/10 my-1"></div>
    <button onclick="WebDesk.addStickyWidget(); WebDesk.closePopups();" class="w-full text-left px-3 py-2 hover:bg-white/10 flex items-center gap-2 text-amber-300"><span>📌</span> Add Desktop Widget</button>
    <button onclick="WebDesk.syncAll(); WebDesk.closePopups();" class="w-full text-left px-3 py-2 hover:bg-white/10 flex items-center gap-2 text-cyan-400"><span>☁️</span> Sync Google Sheets & Drive</button>
    <button onclick="location.reload()" class="w-full text-left px-3 py-2 hover:bg-white/10 flex items-center gap-2 text-slate-400"><span>↺</span> Refresh Desktop</button>
  </div>

  <script>
    /* =========================================================================
       WEBDESK ULTRA OS v5.0 — MULTI-PLATFORM RUNTIME
       ========================================================================= */

    const WebDesk = {
      state: {
        unlocked: false,
        masterHash: '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9', // SHA-256 for 'admin123'
        windows: {},
        topZ: 100,
        apps: [],
        allAppsMaster: [],
        hiddenAppIds: JSON.parse(localStorage.getItem('wd_hidden_apps') || '[]'),
        draggedAppId: null,
        sysConfig: {
          theme: 'default',
          webhookUrl: localStorage.getItem('webdesk_sync_url') || '',
          autoSync: true
        }
      },

      audioCtx: null,

      getAudioContext() {
        if (!this.audioCtx) {
          this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
        return this.audioCtx;
      },

      playChime(type = 'chime') {
        try {
          const ctx = this.getAudioContext();
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.12, now);
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === 'chime') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, now);
            osc.frequency.setValueAtTime(880, now + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
            osc.start(now);
            osc.stop(now + 0.33);
          } else if (type === 'alert') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(850, now);
            osc.frequency.setValueAtTime(1150, now + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.36);
          }
        } catch (e) {}
      },

      notify(title, msg, type = 'chime') {
        this.playChime(type);
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'glass rounded-2xl p-3 win-shadow border border-white/20 text-xs pointer-events-auto flex items-start gap-2.5 transition-all duration-300';
        toast.innerHTML = `
          <div class="w-6 h-6 rounded-lg bg-brand-500/20 text-brand-500 flex items-center justify-center shrink-0 font-bold">🔔</div>
          <div class="flex-1">
            <div class="font-bold text-white">${title}</div>
            <div class="text-slate-300 text-[11px] mt-0.5">${msg}</div>
          </div>
          <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white p-1">✕</button>
        `;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          setTimeout(() => toast.remove(), 300);
        }, 3800);
      },

      async sha256(str) {
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
      },

      async unlockOS() {
        const input = document.getElementById('lock-pass-input').value;
        const hash = await this.sha256(input || 'admin123');
        const saved = localStorage.getItem('webdesk_pwd_hash') || this.state.masterHash;

        if (hash === saved || input === 'admin123') {
          const lock = document.getElementById('lock-screen');
          lock.style.display = 'none';
          this.state.unlocked = true;
          this.playChime('chime');
          this.notify('Workstation Active', 'Session unlocked and verified.');

          // Auto-init cloud workspace if webhook configured but never initialized
          if (this.state.sysConfig.webhookUrl && !localStorage.getItem('wd_cloud_initialized')) {
            this.initMasterCloudWorkspace(false);
          }
        } else {
          const err = document.getElementById('lock-err');
          err.innerText = 'Incorrect master password.';
          this.playChime('alert');
          setTimeout(() => { err.innerText = ''; }, 2500);
        }
      },

      lockOS() {
        this.state.unlocked = false;
        const lock = document.getElementById('lock-screen');
        lock.style.display = 'flex';
        document.getElementById('lock-pass-input').value = '';
        this.closePopups();
      },

      async resetPasswordFallback() {
        this.state.masterHash = await this.sha256('admin123');
        localStorage.setItem('webdesk_pwd_hash', this.state.masterHash);
        document.getElementById('lock-pass-input').value = 'admin123';
        document.getElementById('lock-err').innerText = 'Reset to default: admin123';
      },

      registerApplications() {
        const coreApps = [
          { id: 'browser', name: 'WebSurfer Browser', icon: '🌐', category: 'Internet', width: 780, height: 560, isCore: true, render: this.appsView.browser },
          { id: 'pwainstall', name: 'PWA Web Installer', icon: '🔗', category: 'System', width: 640, height: 500, isCore: true, render: this.appsView.pwainstall },
          { id: 'appmanager', name: 'App Manager', icon: '⚙️', category: 'System', width: 700, height: 540, isCore: true, render: this.appsView.appmanager },
          { id: 'codevault', name: 'Developer Code Vault', icon: '📋', category: 'Developer', width: 720, height: 540, isCore: true, render: this.appsView.codevault },
          { id: 'todo', name: 'Task Planner', icon: '✅', category: 'Productivity', width: 640, height: 500, isCore: true, render: this.appsView.todo },
          { id: 'calendar', name: 'Calendar & Events', icon: '📅', category: 'Productivity', width: 680, height: 520, isCore: true, render: this.appsView.calendar },
          { id: 'reminders', name: 'Reminders & Alerts', icon: '⏰', category: 'Productivity', width: 520, height: 440, isCore: true, render: this.appsView.reminders },
          { id: 'daystogo', name: 'Days to Go', icon: '⏳', category: 'Productivity', width: 500, height: 460, isCore: true, render: this.appsView.daystogo },
          { id: 'timer', name: 'Timer & Alarm', icon: '⏱️', category: 'Utilities', width: 480, height: 440, isCore: true, render: this.appsView.timer },
          { id: 'docs', name: 'Word Writer Pro', icon: '📄', category: 'Productivity', width: 760, height: 550, isCore: true, render: this.appsView.docs },
          { id: 'sheets', name: 'Grid Excel Sheet', icon: '📊', category: 'Productivity', width: 780, height: 550, isCore: true, render: this.appsView.sheets },
          { id: 'slides', name: 'Slide Deck Studio', icon: '🗂️', category: 'Productivity', width: 760, height: 540, isCore: true, render: this.appsView.slides },
          { id: 'notes', name: 'Markdown Notes', icon: '📝', category: 'Productivity', width: 700, height: 520, isCore: true, render: this.appsView.notes },
          { id: 'widgetnotes', name: 'Widget Notes', icon: '📌', category: 'Productivity', width: 460, height: 420, isCore: true, render: this.appsView.widgetnotes },
          { id: 'pdf', name: 'PDF Reader & Annotator', icon: '📕', category: 'Utilities', width: 700, height: 540, isCore: true, render: this.appsView.pdf },
          { id: 'files', name: 'File Drive Explorer', icon: '📁', category: 'System', width: 720, height: 520, isCore: true, render: this.appsView.files },
          { id: 'media', name: 'Media Player Pro', icon: '▶️', category: 'Media', width: 640, height: 480, isCore: true, render: this.appsView.media },
          { id: 'radio', name: 'Live Web Radio', icon: '📻', category: 'Media', width: 540, height: 480, isCore: true, render: this.appsView.radio },
          { id: 'recorder', name: 'Voice Memo Recorder', icon: '🎙️', category: 'Media', width: 500, height: 460, isCore: true, render: this.appsView.recorder },
          { id: 'paint', name: 'Paint & Canvas Studio', icon: '🎨', category: 'Creative', width: 740, height: 540, isCore: true, render: this.appsView.paint },
          { id: 'calc', name: 'Scientific Calculator', icon: '🧮', category: 'Utilities', width: 400, height: 540, isCore: true, render: this.appsView.calc },
          { id: 'news', name: 'RSS News Reader', icon: '📰', category: 'Internet', width: 680, height: 520, isCore: true, render: this.appsView.news },
          { id: 'contacts', name: 'Contacts Directory', icon: '👤', category: 'Utilities', width: 580, height: 500, isCore: true, render: this.appsView.contacts },
          { id: 'terminal', name: 'Terminal Shell', icon: '💻', category: 'Developer', width: 660, height: 460, isCore: true, render: this.appsView.terminal },
          { id: 'codepad', name: 'CodePad Sandbox', icon: '⚡', category: 'Developer', width: 760, height: 540, isCore: true, render: this.appsView.codepad },
          { id: 'storage', name: 'Storage Diagnostics', icon: '📊', category: 'System', width: 520, height: 480, isCore: true, render: this.appsView.storage },
          { id: 'weather', name: 'Live Weather', icon: '⛅', category: 'Internet', width: 580, height: 480, isCore: true, render: this.appsView.weather },
          { id: 'habits', name: 'Habit Tracker', icon: '🎯', category: 'Productivity', width: 580, height: 500, isCore: true, render: this.appsView.habits },
          { id: 'expenses', name: 'Expense Ledger', icon: '💰', category: 'Finance', width: 640, height: 500, isCore: true, render: this.appsView.expenses },
          { id: 'vault', name: 'Password Vault', icon: '🔐', category: 'Security', width: 600, height: 500, isCore: true, render: this.appsView.vault },
          { id: 'worldclock', name: 'World Clock Matrix', icon: '🌐', category: 'Utilities', width: 600, height: 480, isCore: true, render: this.appsView.worldclock },
          { id: 'uploader', name: 'Code App Uploader', icon: '📦', category: 'System', width: 740, height: 560, isCore: true, render: this.appsView.uploader },
          { id: 'settings', name: 'System Settings', icon: '⚙️', category: 'System', width: 680, height: 560, isCore: true, render: this.appsView.settings },
          { id: 'spec', name: 'Requirements & Spec', icon: '📋', category: 'System', width: 760, height: 560, isCore: true, render: this.appsView.spec }
        ];

        // Load custom installed apps (URL PWAs & uploaded code)
        const customApps = JSON.parse(localStorage.getItem('webdesk_custom_apps') || '[]');
        customApps.forEach(c => {
          coreApps.push({
            id: c.id,
            name: c.name,
            icon: c.icon || '🌐',
            category: c.isPwaUrl ? 'PWA Web App' : 'Custom Upload',
            isCustom: true,
            isCore: false,
            isPwaUrl: !!c.isPwaUrl,
            url: c.url,
            code: c.code,
            width: 760,
            height: 540,
            render: (body) => {
              const ifr = document.createElement('iframe');
              ifr.className = 'w-full h-full border-none bg-white';
              ifr.setAttribute('allow', 'camera; microphone; geolocation; fullscreen; clipboard-read; clipboard-write');
              ifr.sandbox = 'allow-scripts allow-same-origin allow-forms allow-modals allow-popups';
              body.appendChild(ifr);
              if (c.isPwaUrl) {
                ifr.src = c.url;
              } else {
                ifr.srcdoc = c.code;
              }
            }
          });
        });

        this.state.allAppsMaster = [...coreApps];

        // Filter out hidden/deleted apps
        const visibleApps = coreApps.filter(a => !this.state.hiddenAppIds.includes(a.id));

        // Apply saved ordering of shortcuts if available
        const savedOrder = JSON.parse(localStorage.getItem('wd_app_order') || 'null');
        if (savedOrder && Array.isArray(savedOrder)) {
          visibleApps.sort((a, b) => {
            const idxA = savedOrder.indexOf(a.id);
            const idxB = savedOrder.indexOf(b.id);
            if (idxA !== -1 && idxB !== -1) return idxA - idxB;
            if (idxA !== -1) return -1;
            if (idxB !== -1) return 1;
            return 0;
          });
        }

        this.state.apps = visibleApps;
      },

      saveAppOrder() {
        const order = this.state.apps.map(a => a.id);
        localStorage.setItem('wd_app_order', JSON.stringify(order));
      },

      moveAppOrder(appId, dir) {
        const idx = this.state.apps.findIndex(a => a.id === appId);
        if (idx === -1) return;
        const newIdx = idx + dir;
        if (newIdx < 0 || newIdx >= this.state.apps.length) return;
        const temp = this.state.apps[idx];
        this.state.apps[idx] = this.state.apps[newIdx];
        this.state.apps[newIdx] = temp;
        this.saveAppOrder();
        this.renderDesktopIcons();
        this.renderStartMenu();
      },

      toggleHideApp(appId) {
        if (this.state.hiddenAppIds.includes(appId)) {
          this.state.hiddenAppIds = this.state.hiddenAppIds.filter(id => id !== appId);
        } else {
          this.state.hiddenAppIds.push(appId);
          this.closeWindow(appId);
        }
        localStorage.setItem('wd_hidden_apps', JSON.stringify(this.state.hiddenAppIds));
        this.registerApplications();
        this.renderDesktopIcons();
        this.renderStartMenu();
      },

      restoreAllHiddenApps() {
        this.state.hiddenAppIds = [];
        localStorage.setItem('wd_hidden_apps', JSON.stringify([]));
        this.registerApplications();
        this.renderDesktopIcons();
        this.renderStartMenu();
        this.notify('Apps Restored', 'All core and default applications restored to desktop.');
      },

      renderDesktopIcons() {
        const grid = document.getElementById('desktop-grid');
        grid.innerHTML = '';

        this.state.apps.forEach((app) => {
          const item = document.createElement('div');
          item.className = 'flex flex-col items-center justify-center p-2 rounded-2xl w-20 h-24 hover:bg-white/15 active:scale-90 transition cursor-pointer text-center group select-none touch-manipulation relative';
          item.draggable = true;
          item.dataset.appId = app.id;

          item.ondragstart = (e) => {
            this.state.draggedAppId = app.id;
            item.classList.add('dragging-icon');
            e.dataTransfer.setData('text/plain', app.id);
          };
          item.ondragend = () => {
            item.classList.remove('dragging-icon');
          };
          item.ondragover = (e) => {
            e.preventDefault();
          };
          item.ondrop = (e) => {
            e.preventDefault();
            const sourceId = this.state.draggedAppId || e.dataTransfer.getData('text/plain');
            if (sourceId && sourceId !== app.id) {
              const srcIdx = this.state.apps.findIndex(a => a.id === sourceId);
              const tgtIdx = this.state.apps.findIndex(a => a.id === app.id);
              if (srcIdx !== -1 && tgtIdx !== -1) {
                const moved = this.state.apps.splice(srcIdx, 1)[0];
                this.state.apps.splice(tgtIdx, 0, moved);
                this.saveAppOrder();
                this.renderDesktopIcons();
                this.renderStartMenu();
                this.notify('Shortcut Rearranged', `${moved.name} moved.`);
              }
            }
          };

          item.onclick = (e) => {
            e.stopPropagation();
            this.openApp(app.id);
          };

          item.innerHTML = `
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-brand-500/20 to-purple-600/20 glass flex items-center justify-center text-xl shadow group-hover:scale-105 transition-transform border border-white/10 pointer-events-none">
              ${app.icon}
            </div>
            <span class="mt-1 text-[11px] text-slate-200 font-medium truncate w-full group-hover:text-white drop-shadow pointer-events-none">${app.name}</span>
          `;
          grid.appendChild(item);
        });
      },

      renderStartMenu(filter = '') {
        const list = document.getElementById('start-list');
        list.innerHTML = '';
        const q = filter.toLowerCase();

        this.state.apps
          .filter(a => a.name.toLowerCase().includes(q) || a.category.toLowerCase().includes(q))
          .forEach(app => {
            const row = document.createElement('div');
            row.className = 'flex items-center justify-between p-2.5 rounded-xl hover:bg-white/10 active:bg-white/20 cursor-pointer transition touch-manipulation';
            
            row.onclick = () => {
              this.openApp(app.id);
              this.closePopups();
            };

            row.innerHTML = `
              <div class="flex items-center gap-2.5 pointer-events-none">
                <span class="text-lg">${app.icon}</span>
                <div>
                  <div class="font-semibold text-xs text-white">${app.name}</div>
                  <div class="text-[10px] text-slate-400">${app.category}</div>
                </div>
              </div>
            `;
            list.appendChild(row);
          });
        document.getElementById('start-count').innerText = `${this.state.apps.length} Apps`;
      },

      filterStartMenu(q) {
        this.renderStartMenu(q);
      },

      toggleStartMenu(e) {
        if (e) e.stopPropagation();
        const m = document.getElementById('start-menu');
        m.classList.toggle('hidden');
        document.getElementById('context-menu').classList.add('hidden');
      },

      closePopups() {
        document.getElementById('start-menu').classList.add('hidden');
        document.getElementById('context-menu').classList.add('hidden');
      },

      openContextMenu(e) {
        e.preventDefault();
        const m = document.getElementById('context-menu');
        const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 10;
        const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 10;
        m.style.left = `${Math.min(window.innerWidth - 240, clientX)}px`;
        m.style.top = `${Math.min(window.innerHeight - 260, clientY)}px`;
        m.classList.remove('hidden');
      },

      openApp(appId) {
        this.playChime('chime');

        if (this.state.windows[appId]) {
          this.bringToFront(appId);
          if (this.state.windows[appId].minimized) {
            this.state.windows[appId].minimized = false;
            const el = document.getElementById(`win-${appId}`);
            if (el) el.classList.remove('hidden');
          }
          this.updateTaskbar();
          return;
        }

        const app = this.state.allAppsMaster.find(a => a.id === appId) || this.state.apps.find(a => a.id === appId);
        if (!app) return;

        const isTabletOrMobile = window.innerWidth < 850;
        const isIpad = /Macintosh|iPad/.test(navigator.userAgent) && 'ontouchend' in document;
        const initialW = isTabletOrMobile ? window.innerWidth : Math.min(window.innerWidth - 30, app.width || 640);
        const initialH = isTabletOrMobile ? window.innerHeight - 56 : Math.min(window.innerHeight - 70, app.height || 500);
        const cascade = (Object.keys(this.state.windows).length * 24) % 140;
        const initialX = isTabletOrMobile ? 0 : Math.max(10, Math.min(window.innerWidth - initialW - 20, 40 + cascade));
        const initialY = isTabletOrMobile ? 0 : Math.max(10, Math.min(window.innerHeight - initialH - 60, 20 + cascade));

        this.state.topZ++;
        this.state.windows[appId] = {
          x: initialX,
          y: initialY,
          width: initialW,
          height: initialH,
          maximized: isTabletOrMobile && !isIpad,
          minimized: false,
          zIndex: this.state.topZ
        };

        this.createWindowDOM(app);
        this.updateTaskbar();
      },

      createWindowDOM(app) {
        const container = document.getElementById('window-layer');
        const win = this.state.windows[app.id];

        const winEl = document.createElement('div');
        winEl.id = `win-${app.id}`;
        winEl.className = 'absolute pointer-events-auto flex flex-col rounded-2xl glass win-shadow overflow-hidden';
        winEl.style.left = `${win.x}px`;
        winEl.style.top = `${win.y}px`;
        winEl.style.width = `${win.width}px`;
        winEl.style.height = `${win.height}px`;
        winEl.style.zIndex = win.zIndex;
        winEl.onpointerdown = () => this.bringToFront(app.id);

        const header = document.createElement('div');
        header.className = 'h-11 bg-slate-950/90 border-b border-white/10 flex items-center justify-between px-3 select-none shrink-0 touch-none';
        header.innerHTML = `
          <div class="flex items-center gap-2 truncate">
            <button onclick="WebDesk.handleAppBack('${app.id}')" class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 active:scale-90 text-xs text-brand-500 font-bold transition touch-manipulation" title="Back / Reset App">
              ◀ Back
            </button>
            <span class="text-base">${app.icon}</span>
            <span class="text-xs font-semibold text-slate-200 truncate">${app.name}</span>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button onclick="WebDesk.minimizeWindow('${app.id}')" class="w-8 h-8 rounded-lg hover:bg-white/10 active:scale-90 flex items-center justify-center text-slate-400 hover:text-white transition touch-manipulation">―</button>
            <button onclick="WebDesk.toggleMaximize('${app.id}')" class="w-8 h-8 rounded-lg hover:bg-white/10 active:scale-90 flex items-center justify-center text-slate-400 hover:text-white transition touch-manipulation">▢</button>
            <button onclick="WebDesk.closeWindow('${app.id}')" class="w-8 h-8 rounded-lg hover:bg-rose-500/30 active:scale-90 text-slate-400 hover:text-rose-400 flex items-center justify-center transition touch-manipulation">✕</button>
          </div>
        `;

        const body = document.createElement('div');
        body.className = 'flex-1 overflow-hidden relative bg-slate-950/80 text-slate-100 flex flex-col';
        body.id = `body-${app.id}`;

        ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw'].forEach(dir => {
          const r = document.createElement('div');
          r.className = `resizer resizer-${dir}`;
          r.onpointerdown = (e) => this.startResize(e, app.id, dir);
          winEl.appendChild(r);
        });

        winEl.appendChild(header);
        winEl.appendChild(body);
        container.appendChild(winEl);

        this.setupDrag(winEl, header, app.id);
        app.render(body);
      },

      handleAppBack(appId) {
        this.playChime('chime');
        const body = document.getElementById(`body-${appId}`);
        if (!body) return;

        const iframe = body.querySelector('iframe');
        if (iframe && iframe.contentWindow) {
          try {
            iframe.contentWindow.history.back();
            this.notify('Navigated Back', 'Returned to previous browser history state.');
            return;
          } catch(e){}
        }

        const app = this.state.allAppsMaster.find(a => a.id === appId) || this.state.apps.find(a => a.id === appId);
        if (app) {
          body.innerHTML = '';
          app.render(body);
          this.notify(app.name, 'View restored to default screen.');
        }
      },

      setupDrag(winEl, header, appId) {
        let isDragging = false;
        let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

        const onPointerDown = (e) => {
          if (e.target.closest('button') || e.target.closest('input')) return;
          this.bringToFront(appId);
          if (this.state.windows[appId] && this.state.windows[appId].maximized && window.innerWidth < 640) {
            return;
          }
          isDragging = true;
          const point = e.touches ? e.touches[0] : e;
          startX = point.clientX;
          startY = point.clientY;
          initialLeft = winEl.offsetLeft;
          initialTop = winEl.offsetTop;

          try {
            if (header.setPointerCapture && e.pointerId) {
              header.setPointerCapture(e.pointerId);
            }
          } catch (err) {}
        };

        const onPointerMove = (e) => {
          if (!isDragging) return;
          const point = e.touches ? e.touches[0] : e;
          if (!point) return;

          if (e.cancelable) e.preventDefault();

          const dx = point.clientX - startX;
          const dy = point.clientY - startY;

          const newX = Math.max(-winEl.offsetWidth + 80, Math.min(window.innerWidth - 60, initialLeft + dx));
          const newY = Math.max(0, Math.min(window.innerHeight - 60, initialTop + dy));

          winEl.style.left = `${newX}px`;
          winEl.style.top = `${newY}px`;

          if (this.state.windows[appId]) {
            this.state.windows[appId].x = newX;
            this.state.windows[appId].y = newY;
          }
        };

        const onPointerUp = (e) => {
          if (!isDragging) return;
          isDragging = false;
          try {
            if (header.releasePointerCapture && e.pointerId) {
              header.releasePointerCapture(e.pointerId);
            }
          } catch (err) {}
        };

        header.addEventListener('pointerdown', onPointerDown);
        header.addEventListener('pointermove', onPointerMove);
        header.addEventListener('pointerup', onPointerUp);
        header.addEventListener('pointercancel', onPointerUp);

        header.addEventListener('touchstart', onPointerDown, { passive: false });
        header.addEventListener('touchmove', onPointerMove, { passive: false });
        header.addEventListener('touchend', onPointerUp, { passive: false });
      },

      startResize(e, appId, dir) {
        e.preventDefault();
        e.stopPropagation();
        this.bringToFront(appId);

        const winEl = document.getElementById(`win-${appId}`);
        if (!winEl) return;

        const point = e.touches ? e.touches[0] : e;
        const startX = point.clientX;
        const startY = point.clientY;
        const startW = winEl.offsetWidth;
        const startH = winEl.offsetHeight;
        const startL = winEl.offsetLeft;
        const startT = winEl.offsetTop;

        const onMove = (ev) => {
          if (ev.cancelable) ev.preventDefault();
          const p = ev.touches ? ev.touches[0] : ev;
          if (!p) return;

          const dx = p.clientX - startX;
          const dy = p.clientY - startY;
          let newW = startW, newH = startH, newX = startL, newY = startT;
          const minW = 280, minH = 180;

          if (dir.includes('e')) newW = Math.max(minW, startW + dx);
          if (dir.includes('s')) newH = Math.max(minH, startH + dy);
          if (dir.includes('w')) {
            if (startW - dx > minW) { newW = startW - dx; newX = startL + dx; }
          }
          if (dir.includes('n')) {
            if (startH - dy > minH) { newH = startH - dy; newY = startT + dy; }
          }

          winEl.style.width = `${newW}px`;
          winEl.style.height = `${newH}px`;
          winEl.style.left = `${newX}px`;
          winEl.style.top = `${newY}px`;

          if (this.state.windows[appId]) {
            this.state.windows[appId].width = newW;
            this.state.windows[appId].height = newH;
            this.state.windows[appId].x = newX;
            this.state.windows[appId].y = newY;
          }
        };

        const onUp = () => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          window.removeEventListener('touchmove', onMove);
          window.removeEventListener('touchend', onUp);
        };

        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onUp, { passive: false });
      },

      bringToFront(appId) {
        if (!this.state.windows[appId]) return;
        this.state.topZ++;
        this.state.windows[appId].zIndex = this.state.topZ;
        const el = document.getElementById(`win-${appId}`);
        if (el) el.style.zIndex = this.state.topZ;
        this.updateTaskbar();
      },

      closeWindow(appId) {
        const el = document.getElementById(`win-${appId}`);
        if (el) el.remove();
        delete this.state.windows[appId];
        this.updateTaskbar();
      },

      minimizeWindow(appId) {
        const win = this.state.windows[appId];
        if (!win) return;
        win.minimized = true;
        const el = document.getElementById(`win-${appId}`);
        if (el) el.classList.add('hidden');
        this.updateTaskbar();
      },

      toggleMaximize(appId) {
        const win = this.state.windows[appId];
        const winEl = document.getElementById(`win-${appId}`);
        if (!win || !winEl) return;

        if (!win.maximized) {
          win.oldX = win.x; win.oldY = win.y; win.oldW = win.width; win.oldH = win.height;
          win.x = 0; win.y = 0; win.width = window.innerWidth; win.height = window.innerHeight - 56;
          win.maximized = true;
        } else {
          win.x = win.oldX || 30; win.y = win.oldY || 30; win.width = win.oldW || 620; win.height = win.oldH || 480;
          win.maximized = false;
        }

        winEl.style.left = `${win.x}px`;
        winEl.style.top = `${win.y}px`;
        winEl.style.width = `${win.width}px`;
        winEl.style.height = `${win.height}px`;
        this.bringToFront(appId);
      },

      updateTaskbar() {
        const bar = document.getElementById('taskbar-tabs');
        bar.innerHTML = '';

        Object.keys(this.state.windows).forEach(appId => {
          const app = this.state.allAppsMaster.find(a => a.id === appId) || this.state.apps.find(a => a.id === appId);
          const win = this.state.windows[appId];
          if (!app) return;

          const isFocused = win.zIndex === this.state.topZ && !win.minimized;
          const tab = document.createElement('button');
          tab.className = `flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-medium transition active:scale-90 touch-manipulation ${
            isFocused ? 'bg-white/20 text-white shadow' : 'bg-white/5 text-slate-400 hover:bg-white/10'
          }`;
          tab.onclick = () => {
            if (win.minimized) {
              win.minimized = false;
              document.getElementById(`win-${appId}`).classList.remove('hidden');
              this.bringToFront(appId);
            } else if (isFocused) {
              this.minimizeWindow(appId);
            } else {
              this.bringToFront(appId);
            }
          };
          tab.innerHTML = `<span>${app.icon}</span><span class="truncate max-w-[85px] hidden sm:inline">${app.name}</span>`;
          bar.appendChild(tab);
        });
      },

      // Initialize Master Cloud Partitioning (Sheets Tabs & Drive App Folders)
      async initMasterCloudWorkspace(showToast = true) {
        if (!this.state.sysConfig.webhookUrl) {
          if (showToast) alert('Please enter and save your Google Apps Script Webhook URL first.');
          return;
        }

        if (showToast) this.notify('Cloud Initializing', 'Setting up master Drive folders & Sheets tabs...');

        const appsManifest = this.state.allAppsMaster.map(a => ({
          id: a.id,
          name: a.name,
          category: a.category
        }));

        try {
          await fetch(this.state.sysConfig.webhookUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'init_master_workspace',
              apps: appsManifest,
              timestamp: new Date().toISOString()
            })
          });

          localStorage.setItem('wd_cloud_initialized', 'true');
          if (showToast) this.notify('Cloud Configured', 'All Drive folders and Sheets tabs created!');
        } catch (e) {
          console.warn('Init error', e);
        }
      },

          const code_gs = `/**
 * WebDesk Ultra Pro - Google Apps Script Synchronization Engine (Code.gs)
 * Handles auto-sheet creation, headers, audit trails, and Google Drive binary files
 */

function doPost(e) {
  try {
    if (!e || !e.postData || !e.postData.contents) {
      return createJsonResponse({ status: "error", message: "Empty payload received" });
    }

    var payload = JSON.parse(e.postData.contents);
    var action = payload.action || "sync_data";
    var ss = SpreadsheetApp.getActiveSpreadsheet();

    // 1. First-time Registration / Master Partitioning
    if (action === "init_master_workspace") {
      return handleMasterWorkspaceInit(ss, payload);
    }

    // 2. Direct File/Media Uploads to App-Specific Folders
    if (action === "upload_media") {
      return handleMediaUpload(payload);
    }

    // 3. Custom Installed App Registry
    if (action === "save_custom_app") {
      return handleCustomAppStorage(ss, payload);
    }

    // 4. Default Multi-App Data Synchronization
    return handleDataSync(ss, payload);
  } catch (err) {
    return createJsonResponse({ status: "error", error: err.toString() });
  }
}

function doGet(e) {
  var action = (e && e.parameter && e.parameter.action) ? e.parameter.action : "ping";
  if (action === "ping") {
    return createJsonResponse({ status: "ok", message: "WebDesk Apps Script listening." });
  }
  if (action === "fetch_all") {
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var sheets = ss.getSheets();
    var result = {};
    sheets.forEach(function(sh) {
      var name = sh.getName();
      if (name.startsWith("App_")) {
        result[name.replace("App_", "")] = sh.getDataRange().getValues().slice(1);
      }
    });
    return createJsonResponse({ status: "ok", data: result });
  }
  return createJsonResponse({ status: "ok" });
}

// Auto-Creates Master Drive Folder and Subfolders for Every App
function handleMasterWorkspaceInit(ss, payload) {
  var rootName = "WebDesk_Drive_Storage";
  var folders = DriveApp.getFoldersByName(rootName);
  var rootFolder = folders.hasNext() ? folders.next() : DriveApp.createFolder(rootName);

  var appList = payload.apps || [];
  var createdFolders = [];
  var createdSheets = [];

  // Default core subfolders
  var defaultFolders = ["General_Files", "Media_Player", "Voice_Memos", "Paint_Canvases", "Documents", "PDF_Docs"];
  defaultFolders.forEach(function(df) {
    var sub = rootFolder.getFoldersByName(df);
    if (!sub.hasNext()) rootFolder.createFolder(df);
  });

  // Create dedicated tab and Drive folder for every registered application
  appList.forEach(function(app) {
    var safeName = (app.name || app.id).replace(/[^a-zA-Z0-9_ ]/g, "").trim().replace(/\\s+/g, "_");
    
    // 1. Google Drive App Subfolder
    var subFolders = rootFolder.getFoldersByName(safeName);
    if (!subFolders.hasNext()) {
      rootFolder.createFolder(safeName);
      createdFolders.push(safeName);
    }

    // 2. Google Sheet Dedicated Tab
    var sheetName = "App_" + safeName.toUpperCase();
    var sheet = ss.getSheetByName(sheetName);
    if (!sheet) {
      sheet = ss.insertSheet(sheetName);
      sheet.appendRow(["Timestamp", "App ID", "Record Type", "Data Payload (JSON)", "Checksum"]);
      sheet.getRange("A1:E1").setFontWeight("bold").setBackground("#e2e8f0");
      sheet.setFrozenRows(1);
      createdSheets.push(sheetName);
    }
  });

  return createJsonResponse({
    status: "success",
    message: "Master Workspace Initialized",
    rootFolderUrl: rootFolder.getUrl(),
    foldersCreated: createdFolders.length,
    sheetsCreated: createdSheets.length
  });
}

function handleDataSync(ss, payload) {
  var appName = (payload.app || "GENERAL").toUpperCase().replace(/[^A-Z0-9_]/g, "_");
  var sheetName = "App_" + appName;
  var sheet = ss.getSheetByName(sheetName);

  if (!sheet) {
    sheet = ss.insertSheet(sheetName);
    sheet.appendRow(["Timestamp", "App ID", "Record Type", "Data Payload", "Checksum"]);
    sheet.getRange("A1:E1").setFontWeight("bold").setBackground("#e2e8f0");
    sheet.setFrozenRows(1);
  }

  var timestamp = new Date();
  var dataContent = typeof payload.data === "object" ? JSON.stringify(payload.data) : (payload.data || "");
  var checksum = Utilities.base64Encode(Utilities.computeDigest(Utilities.DigestAlgorithm.MD5, dataContent));
  sheet.appendRow([timestamp, appName, "STATE_SYNC", dataContent, checksum]);

  return createJsonResponse({ status: "success", app: appName, timestamp: timestamp });
}

function handleCustomAppStorage(ss, payload) {
  var sheetName = "App_CUSTOM_REGISTRY";
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) {
    sheet = ss.insertSheet(sheetName);
    sheet.appendRow(["Installed At", "App ID", "Title", "Code Size (Bytes)", "Source Code"]);
    sheet.getRange("A1:E1").setFontWeight("bold").setBackground("#dbeafe");
    sheet.setFrozenRows(1);
  }
  sheet.appendRow([new Date(), payload.appId || ("app_" + Date.now()), payload.title || "Custom", (payload.code || "").length, payload.code || ""]);
  return createJsonResponse({ status: "success", message: "Custom application saved" });
}

function handleMediaUpload(payload) {
  var rootName = "WebDesk_Drive_Storage";
  var folders = DriveApp.getFoldersByName(rootName);
  var rootFolder = folders.hasNext() ? folders.next() : DriveApp.createFolder(rootName);

  // Put in app subfolder if specified
  var targetFolder = rootFolder;
  if (payload.appFolder) {
    var sub = rootFolder.getFoldersByName(payload.appFolder);
    targetFolder = sub.hasNext() ? sub.next() : rootFolder.createFolder(payload.appFolder);
  }

  var fileName = payload.fileName || ("file_" + Date.now());
  var decodedBytes = Utilities.base64Decode(payload.base64Data);
  var blob = Utilities.newBlob(decodedBytes, payload.mimeType || "application/octet-stream", fileName);
  var file = targetFolder.createFile(blob);
  file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);

  return createJsonResponse({ status: "success", fileUrl: file.getUrl() });
}

function createJsonResponse(data) {
  return ContentService.createTextOutput(JSON.stringify(data)).setMimeType(ContentService.MimeType.JSON);
}`;

  );
});`;

            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            rec = new MediaRecorder(stream);
            chunks = [];

            rec.onstop = () => {

                  <button id="pt-clr" class="px-3 py-1 bg-rose-500/20 text-rose-300 rounded font-bold active:scale-95 touch-manipulation">Clear</button>
                </div>
              </div>
              <canvas id="pt-cv" class="flex-1 bg-slate-900 touch-none w-full h-full"></canvas>
            </div>
          `;
          const cv = el.querySelector('#pt-cv');
          const ctx = cv.getContext('2d');
          let history = [];
          
          setTimeout(() => {
            cv.width = cv.parentElement.clientWidth;
            cv.height = cv.parentElement.clientHeight - 40;
          }, 100);

          let drawing = false;
          const getPos = (e) => {
            const r = cv.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return { x: clientX - r.left, y: clientY - r.top };
          };

          const start = (e) => {
            history.push(ctx.getImageData(0, 0, cv.width, cv.height));
            drawing = true;
            ctx.beginPath();
            const p = getPos(e);
            ctx.moveTo(p.x, p.y);
          };
          const stop = () => { drawing = false; };
          const draw = (e) => {
            if (!drawing) return;
            if (e.cancelable) e.preventDefault();
            const p = getPos(e);
            ctx.lineWidth = el.querySelector('#pt-sz').value;
            ctx.strokeStyle = el.querySelector('#pt-col').value;
            ctx.lineCap = 'round';
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
          };

          cv.addEventListener('pointerdown', start);
          cv.addEventListener('pointermove', draw);
          cv.addEventListener('pointerup', stop);
          cv.addEventListener('touchstart', start, { passive: false });
          cv.addEventListener('touchmove', draw, { passive: false });
          cv.addEventListener('touchend', stop);

          el.querySelector('#pt-undo').onclick = () => {
            if (history.length) ctx.putImageData(history.pop(), 0, 0);
          };
          el.querySelector('#pt-clr').onclick = () => {
            history.push(ctx.getImageData(0, 0, cv.width, cv.height));
            ctx.clearRect(0, 0, cv.width, cv.height);
          };
        },

        clock.innerHTML = `
          <button onclick="this.parentElement.remove()" class="absolute top-2 right-2 text-slate-500 hover:text-rose-400 p-1.5 touch-manipulation">✕</button>
          <div class="text-slate-400 font-bold uppercase text-[10px] mb-1">Live Clock</div>
          <div id="w-clk-time" class="text-2xl font-bold font-mono text-white">12:00:00 PM</div>
          <div id="w-clk-date" class="text-slate-400 text-[11px]">Sep 21, 2026</div>
        `;
        container.appendChild(clock);

        const noteVal = localStorage.getItem('wd_widget_note') || 'Sticky desktop note...';
        const note = document.createElement('div');
        note.className = 'glass rounded-3xl p-4 win-shadow border border-white/10 w-60 text-xs flex flex-col relative';
        note.innerHTML = `
          <button onclick="this.parentElement.remove()" class="absolute top-2 right-2 text-slate-500 hover:text-rose-400 p-1.5 touch-manipulation">✕</button>
          <div class="text-amber-400 font-bold uppercase text-[10px] mb-1">Sticky Note</div>
          <textarea id="w-note-tx" class="bg-transparent text-amber-200 text-xs resize-none focus:outline-none h-16 leading-relaxed">${noteVal}</textarea>
        `;
        container.appendChild(note);
        note.querySelector('#w-note-tx').oninput = (e) => {
          localStorage.setItem('wd_widget_note', e.target.value);
        };
      },

      addStickyWidget() {
        this.renderWidgets();
      },

      setTheme(t) {
        document.body.className = `h-full w-full text-slate-100 flex flex-col justify-between select-none relative overflow-hidden font-sans theme-${t}`;
        this.state.sysConfig.theme = t;
      },

      downloadFile(name, text) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
        a.download = name;
        a.click();
      },

      async syncAll() {
        const ind = document.getElementById('sync-indicator');
        const txt = document.getElementById('sync-text');
        if (ind) ind.className = 'w-2 h-2 rounded-full bg-amber-400 animate-ping';
        if (txt) txt.innerText = 'Syncing...';

        const payload = {
          action: 'sync_data',
          timestamp: new Date().toISOString(),
          applications: {
            todo: localStorage.getItem('wd_todo_data'),
            notes: localStorage.getItem('wd_notes_data'),
            sheets: localStorage.getItem('wd_sheets_data'),
            contacts: localStorage.getItem('wd_contacts_data'),
            habits: localStorage.getItem('wd_habits_data'),
            expenses: localStorage.getItem('wd_expenses_data')
          }
        };

        if (this.state.sysConfig.webhookUrl) {
          try {
            await fetch(this.state.sysConfig.webhookUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            this.notify('Cloud Synchronized', 'Records synced with Google Sheets & Drive.');
          } catch(e) {}
        }

        setTimeout(() => {
          if (ind) ind.className = 'w-2 h-2 rounded-full bg-emerald-400';
          if (txt) txt.innerText = this.state.sysConfig.webhookUrl ? 'Cloud Synced' : 'Local Cached';
        }, 600);
      },

      startClock() {
        const tick = () => {
          const d = new Date();
          const tStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const dStr = d.toLocaleDateString([], { month: 'short', day: 'numeric' });
          document.getElementById('tray-time').innerText = tStr;
          document.getElementById('tray-date').innerText = dStr;

          const wt = document.getElementById('w-clk-time');
          const wd = document.getElementById('w-clk-date');
          if (wt) wt.innerText = d.toLocaleTimeString();
          if (wd) wd.innerText = d.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
        };
        tick();
        setInterval(tick, 1000);
      },

      init() {
        this.registerApplications();
        this.renderDesktopIcons();
        this.renderStartMenu();
        this.renderWidgets();
        this.startClock();

        document.getElementById('lock-pass-input').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') this.unlockOS();
        });

        document.getElementById('desktop-workspace').addEventListener('click', () => {
          this.closePopups();
        });

        window.addEventListener('touchstart', () => {
          this.getAudioContext();
        }, { once: true });

        if ('serviceWorker' in navigator) {
          const swCode = `
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('activate', e => self.clients.claim());
            self.addEventListener('fetch', e => {});
          `;
          const blob = new Blob([swCode], { type: 'application/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        }
      }
    };

    window.addEventListener('DOMContentLoaded', () => WebDesk.init());
  </script>
</body>
</html>

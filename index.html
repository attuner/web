<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ChromeOS Web Desktop - iPad Mini 6 Edition</title>
  <meta name="theme-color" content="#1e1e2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cros: {
              bg: '#12161f',
              shelf: 'rgba(24, 28, 36, 0.82)',
              surface: '#202634',
              accent: '#8ab4f8',
              accentDark: '#1b66c9',
              border: 'rgba(255, 255, 255, 0.12)'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0b0f17;
    }

    /* Target root shell elements with non-selectable behavior */
    #desktop-wallpaper, #desktop-workspace, #shelf, .window-titlebar, .window-resize-handle, #trackpad-container, #context-menu {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* Bugfix #1: Allow inner application content, inputs, canvases, and textareas to select & receive touch gestures */
    .window-content, .window-content input, .window-content textarea, .window-content [contenteditable="true"] {
      user-select: text !important;
      -webkit-user-select: text !important;
      touch-action: auto !important;
    }
    
    .window-content canvas {
      touch-action: none !important; /* Canvases handle their own precise pointer events */
      user-select: none !important;
    }

    .glass {
      background: rgba(28, 34, 46, 0.78);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .glass-light {
      background: rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Floating Window Styles */
    .os-window {
      position: absolute;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      transition: transform 0.16s ease-out, opacity 0.16s ease-out;
      will-change: transform, width, height, top, left;
      touch-action: none;
    }

    .os-window.maximized {
      border-radius: 0 !important;
      border: none !important;
    }

    .os-window.minimized {
      transform: scale(0.55) translateY(240px);
      opacity: 0;
      pointer-events: none;
    }

    /* Window Resize Handles */
    .window-resize-handle { position: absolute; z-index: 30; }
    .resize-n { top: 0; left: 8px; right: 8px; height: 6px; cursor: n-resize; }
    .resize-s { bottom: 0; left: 8px; right: 8px; height: 6px; cursor: s-resize; }
    .resize-w { left: 0; top: 8px; bottom: 8px; width: 6px; cursor: w-resize; }
    .resize-e { right: 0; top: 8px; bottom: 8px; width: 6px; cursor: e-resize; }
    .resize-nw { top: 0; left: 0; width: 14px; height: 14px; cursor: nw-resize; }
    .resize-ne { top: 0; right: 0; width: 14px; height: 14px; cursor: ne-resize; }
    .resize-sw { bottom: 0; left: 0; width: 14px; height: 14px; cursor: sw-resize; }
    .resize-se { bottom: 0; right: 0; width: 14px; height: 14px; cursor: se-resize; }

    /* Snap Target Zone Preview */
    #snap-preview {
      position: absolute;
      background: rgba(138, 180, 248, 0.22);
      border: 2px dashed #8ab4f8;
      border-radius: 12px;
      pointer-events: none;
      transition: all 0.14s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 99990;
      opacity: 0;
    }

    /* Virtual Mouse Cursor */
    #virtual-cursor {
      position: fixed;
      width: 22px;
      height: 22px;
      pointer-events: none;
      z-index: 999999;
      transform: translate(-2px, -2px);
      transition: transform 0.03s ease-out;
      display: none;
    }
    #virtual-cursor.active { display: block; }

    /* Trackpad Adaptation */
    #trackpad-container {
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 90000;
    }

    @media (orientation: landscape) {
      #trackpad-container.trackpad-visible {
        position: fixed;
        bottom: 58px;
        right: 18px;
        width: 210px;
        height: 210px;
        max-width: 24vw;
        max-height: 24vw;
        border-radius: 20px;
        display: flex !important;
      }
      #desktop-workspace { height: calc(100vh - 48px); }
    }

    @media (orientation: portrait) {
      #trackpad-container.trackpad-visible {
        position: fixed;
        bottom: 48px;
        left: 0;
        right: 0;
        width: 100vw;
        height: 22vh;
        border-radius: 18px 18px 0 0;
        display: flex !important;
      }
      body.trackpad-active-portrait #desktop-workspace {
        height: calc(78vh - 48px);
      }
    }

    /* Iframe pointer event shield during window drag/resize */
    .iframe-shield {
      position: absolute;
      inset: 0;
      z-index: 25;
      background: transparent;
      pointer-events: auto;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen w-screen overflow-hidden">
  <!-- Desktop Wallpaper -->
  <div id="desktop-wallpaper" class="absolute inset-0 bg-cover bg-center transition-all duration-700 pointer-events-none"
       style="background-image: radial-gradient(circle at 75% 25%, #1e3a8a 0%, #0f172a 45%, #050811 100%);">
    <div class="absolute inset-0 bg-black/20 backdrop-blur-[2px]"></div>
    <div class="absolute top-1/4 left-1/4 w-96 h-96 rounded-full bg-blue-600/10 blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/3 right-1/4 w-80 h-80 rounded-full bg-indigo-500/10 blur-3xl pointer-events-none"></div>
  </div>

  <!-- Main Workspace -->
  <main id="desktop-workspace" class="relative w-full overflow-hidden transition-all duration-300" style="height: calc(100vh - 48px);">
    <!-- Desktop Icons Grid -->
    <div id="desktop-icons" class="p-6 grid grid-flow-col grid-rows-6 gap-6 w-max max-h-full"></div>
    <!-- Snap Target Ghost Preview -->
    <div id="snap-preview"></div>
  </main>

  <!-- ChromeOS Shelf (Taskbar) -->
  <footer id="shelf" class="fixed bottom-0 left-0 right-0 h-12 glass flex items-center justify-between px-3 z-[99900] border-t border-white/10">
    <!-- Left: Everything Launcher -->
    <div class="flex items-center space-x-2">
      <button id="launcher-toggle-btn" class="w-9 h-9 rounded-full flex items-center justify-center hover:bg-white/10 active:scale-95 transition-all text-white focus:outline-none" title="Launcher">
        <div class="w-4 h-4 rounded-full border-2 border-white/90 flex items-center justify-center">
          <div class="w-1.5 h-1.5 rounded-full bg-white/90"></div>
        </div>
      </button>
      
      <!-- Pinned & Running Apps -->
      <div id="shelf-apps-container" class="flex items-center space-x-1.5 pl-1 border-l border-white/10"></div>
    </div>

    <!-- Right: Quick Settings & System Tray -->
    <div class="flex items-center space-x-2">
      <!-- Virtual Trackpad Toggle Button -->
      <button id="trackpad-toggle-btn" class="px-2.5 h-8 rounded-full glass-light flex items-center space-x-1.5 hover:bg-white/20 active:scale-95 transition text-xs text-gray-200">
        <i class="fa-solid fa-computer-mouse text-blue-400"></i>
        <span class="hidden sm:inline text-[11px] font-medium">Trackpad</span>
      </button>

      <!-- System Status Pill -->
      <button id="system-tray-btn" class="px-3 h-8 rounded-full glass-light flex items-center space-x-2.5 hover:bg-white/20 active:scale-95 transition text-xs text-gray-200">
        <i class="fa-solid fa-wifi text-[12px]" id="tray-wifi-icon"></i>
        <span id="battery-indicator" class="flex items-center space-x-1">
          <i class="fa-solid fa-battery-three-quarters text-green-400 text-[13px]"></i>
          <span class="text-[11px] font-medium hidden xs:inline">88%</span>
        </span>
        <span id="clock-display" class="font-medium text-[12px] tracking-wide">12:00</span>
      </button>
    </div>
  </footer>

  <!-- App Launcher Menu -->
  <div id="app-launcher-menu" class="fixed bottom-14 left-3 w-80 sm:w-96 glass rounded-2xl p-4 shadow-2xl z-[99950] hidden opacity-0 scale-95 transition-all duration-200 origin-bottom-left border border-white/15">
    <div class="relative mb-3">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-sm"></i>
      <input type="text" id="launcher-search-input" placeholder="Search apps, files, or settings..." 
             class="w-full bg-white/10 text-sm text-white placeholder-gray-400 pl-9 pr-3 py-1.5 rounded-full border border-white/10 focus:outline-none focus:border-blue-400">
    </div>
    <div class="flex items-center justify-between px-2 mb-2">
      <p class="text-[11px] uppercase tracking-wider text-gray-400 font-semibold">Installed Applications</p>
      <span class="text-[10px] text-gray-400" id="launcher-app-count">10 Apps</span>
    </div>
    <div id="launcher-grid" class="grid grid-cols-4 gap-3 max-h-72 overflow-y-auto p-1"></div>
  </div>

  <!-- Quick Settings Menu -->
  <div id="quick-settings-menu" class="fixed bottom-14 right-3 w-80 glass rounded-2xl p-4 shadow-2xl z-[99950] hidden opacity-0 scale-95 transition-all duration-200 origin-bottom-right border border-white/15">
    <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-3">
      <div>
        <h4 class="font-semibold text-sm text-white" id="qs-time">12:00 PM</h4>
        <p class="text-[11px] text-gray-400" id="qs-date">Tuesday, Oct 24</p>
      </div>
      <div class="flex space-x-1.5">
        <button id="btn-fullscreen" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 text-gray-300" title="Toggle Fullscreen">
          <i class="fa-solid fa-expand text-xs"></i>
        </button>
        <button id="btn-lock-session" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 text-gray-300" title="Lock System">
          <i class="fa-solid fa-lock text-xs text-blue-400"></i>
        </button>
      </div>
    </div>

    <!-- Toggles -->
    <div class="grid grid-cols-3 gap-2 mb-4">
      <button class="flex flex-col items-center justify-center p-2 rounded-xl bg-blue-500/30 border border-blue-400/40 text-blue-300 hover:bg-blue-500/40">
        <i class="fa-solid fa-wifi text-base mb-1"></i>
        <span class="text-[10px] font-medium">Wi-Fi</span>
      </button>
      <button class="flex flex-col items-center justify-center p-2 rounded-xl bg-white/10 hover:bg-white/20 text-gray-200">
        <i class="fa-brands fa-bluetooth-b text-base mb-1"></i>
        <span class="text-[10px] font-medium">Bluetooth</span>
      </button>
      <button id="toggle-pencil-precision" class="flex flex-col items-center justify-center p-2 rounded-xl bg-white/10 hover:bg-white/20 text-gray-200">
        <i class="fa-solid fa-pen-nib text-base mb-1"></i>
        <span class="text-[10px] font-medium">Pencil Mode</span>
      </button>
    </div>

    <div class="space-y-3 text-xs">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-sun text-gray-400 text-sm"></i>
        <input type="range" id="slider-brightness" min="40" max="100" value="100" class="w-full accent-blue-400 bg-white/20 rounded-lg h-1.5 cursor-pointer">
      </div>
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-volume-high text-gray-400 text-sm"></i>
        <input type="range" id="slider-volume" min="0" max="100" value="75" class="w-full accent-blue-400 bg-white/20 rounded-lg h-1.5 cursor-pointer">
      </div>
    </div>
  </div>

  <!-- Virtual Trackpad with Hardware Buttons & Quick Clipboard Actions -->
  <div id="trackpad-container" class="glass hidden flex-col border border-white/20 shadow-2xl select-none touch-none">
    <div class="h-6 px-3 bg-white/5 border-b border-white/10 flex items-center justify-between text-[11px] text-gray-300 font-medium">
      <span class="flex items-center space-x-1.5">
        <i class="fa-solid fa-hand-pointer text-[10px] text-blue-400"></i>
        <span>Virtual Trackpad</span>
        <span id="tp-drag-indicator" class="hidden text-[9px] px-1 bg-blue-500/40 text-blue-300 rounded">DRAGGING</span>
      </span>
      <div class="flex items-center space-x-2">
        <button id="tp-pencil-mode-btn" title="Toggle Precision Mode" class="px-1 text-[10px] rounded hover:bg-white/20 text-gray-400">
          <i class="fa-solid fa-pen"></i>
        </button>
        <button id="tp-close-btn" class="hover:text-red-400">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>
    </div>
    <!-- Trackpad Sensory Surface -->
    <div id="trackpad-surface" class="flex-1 relative cursor-crosshair flex items-center justify-center overflow-hidden">
      <div class="text-center pointer-events-none opacity-20">
        <i class="fa-regular fa-hand text-3xl mb-1"></i>
        <p class="text-[9px]">Tap & Drag to Highlight • Hold L-Btn to Drag</p>
      </div>
      <!-- Hardware & Clipboard Action Bar -->
      <div class="absolute bottom-1.5 left-2 right-2 h-7 flex space-x-1 pointer-events-auto">
        <button id="tp-btn-left" class="flex-1 bg-white/10 hover:bg-white/20 active:bg-blue-500/50 rounded text-[10px] font-semibold text-gray-300 transition">L-Click</button>
        <button id="tp-btn-copy" class="px-2 bg-white/10 hover:bg-white/20 active:bg-blue-500/50 rounded text-[10px] font-semibold text-blue-300 transition" title="Copy Selected Text">Copy</button>
        <button id="tp-btn-paste" class="px-2 bg-white/10 hover:bg-white/20 active:bg-blue-500/50 rounded text-[10px] font-semibold text-blue-300 transition" title="Paste Clipboard">Paste</button>
        <button id="tp-btn-right" class="flex-1 bg-white/10 hover:bg-white/20 active:bg-blue-500/50 rounded text-[10px] font-semibold text-gray-300 transition">R-Click</button>
      </div>
    </div>
  </div>

  <!-- Floating Clipboard Action Bar -->
  <div id="floating-clipboard-bar" class="fixed hidden z-[999998] glass px-2 py-1 rounded-xl shadow-2xl flex items-center space-x-1.5 border border-white/20">
    <button id="clip-copy-btn" class="px-2 py-1 rounded hover:bg-white/15 text-xs text-blue-300 flex items-center space-x-1 font-medium">
      <i class="fa-regular fa-copy text-[11px]"></i>
      <span>Copy</span>
    </button>
    <button id="clip-cut-btn" class="px-2 py-1 rounded hover:bg-white/15 text-xs text-blue-300 flex items-center space-x-1 font-medium">
      <i class="fa-solid fa-scissors text-[11px]"></i>
      <span>Cut</span>
    </button>
    <button id="clip-paste-btn" class="px-2 py-1 rounded hover:bg-white/15 text-xs text-emerald-300 flex items-center space-x-1 font-medium">
      <i class="fa-regular fa-paste text-[11px]"></i>
      <span>Paste</span>
    </button>
  </div>

  <!-- Universal Desktop & App Context Menu -->
  <div id="context-menu" class="fixed hidden z-[99995] w-48 glass rounded-xl py-1.5 shadow-2xl border border-white/20 text-xs text-gray-200"></div>

  <!-- Native Admin Login Modal / Lock Screen -->
  <div id="lockscreen-modal" class="fixed inset-0 z-[100000] bg-slate-950/95 backdrop-blur-xl flex items-center justify-center hidden">
    <div class="w-84 max-w-[90vw] glass p-6 rounded-2xl border border-white/15 shadow-2xl text-center space-y-4">
      <div class="w-16 h-16 rounded-full bg-blue-600/20 border border-blue-400/40 mx-auto flex items-center justify-center text-blue-400 text-2xl shadow-lg">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div>
        <h3 class="text-base font-bold text-white">Administrator Authentication</h3>
        <p class="text-xs text-gray-400 mt-0.5">iPad Mini Web Workstation Security</p>
      </div>
      <div class="space-y-2.5 text-left">
        <div>
          <label class="block text-[11px] font-medium text-gray-300 mb-1">Admin Username</label>
          <input type="text" id="admin-user-input" value="admin" class="w-full bg-black/40 border border-white/15 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-400">
        </div>
        <div>
          <label class="block text-[11px] font-medium text-gray-300 mb-1">Password</label>
          <input type="password" id="admin-pass-input" placeholder="Enter password (default: admin123)" class="w-full bg-black/40 border border-white/15 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-400">
        </div>
      </div>
      <div id="auth-err-msg" class="text-red-400 text-[11px] hidden font-medium"></div>
      <button id="btn-submit-auth" class="w-full py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs font-semibold text-white transition active:scale-95 shadow-md">
        Unlock Workstation
      </button>
    </div>
  </div>

  <!-- Emulated Virtual Mouse Cursor -->
  <div id="virtual-cursor">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M4 2L20 10L12 13L9 21L4 2Z" fill="#8ab4f8" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>
  </div>

  <script>
    /* Default Cloud Backend Endpoint (No user prompt required) */
    const CLOUD_BACKEND_URL = "https://script.google.com/macros/s/AKfycby-YOUR_DEPLOYMENT_ID/exec";

    /* Core Built-in Applications Registry */
    const APPS_REGISTRY = [
      {
        id: 'settings',
        title: 'Control Panel',
        icon: 'fa-solid fa-sliders',
        color: '#60a5fa',
        pinned: true,
        isSystem: true,
        init: renderControlPanel
      },
      {
        id: 'installer',
        title: 'App Installer',
        icon: 'fa-solid fa-box-archive',
        color: '#34d399',
        pinned: true,
        isSystem: true,
        init: renderAppInstaller
      },
      {
        id: 'cloudsync',
        title: 'Cloud Sync Center',
        icon: 'fa-solid fa-cloud-arrow-up',
        color: '#38bdf8',
        pinned: true,
        isSystem: true,
        init: renderCloudSyncCenter
      },
      {
        id: 'inspector',
        title: 'Code Inspector',
        icon: 'fa-solid fa-code',
        color: '#f59e0b',
        pinned: true,
        isSystem: true,
        init: renderScriptInspector
      },
      {
        id: 'studio',
        title: 'Code Studio IDE',
        icon: 'fa-solid fa-laptop-code',
        color: '#a78bfa',
        pinned: true,
        isSystem: true,
        init: renderCodeStudio
      },
      {
        id: 'files',
        title: 'File Explorer',
        icon: 'fa-solid fa-folder-open',
        color: '#fbbf24',
        pinned: true,
        isSystem: true,
        init: renderFileExplorer
      },
      {
        id: 'notes',
        title: 'Pencil Notes',
        icon: 'fa-solid fa-pen-fancy',
        color: '#ec4899',
        pinned: true,
        isSystem: true,
        init: renderPencilNotes
      },
      {
        id: 'terminal',
        title: 'DevTerminal',
        icon: 'fa-solid fa-terminal',
        color: '#10b981',
        pinned: false,
        isSystem: true,
        init: renderDevTerminal
      },
      {
        id: 'media',
        title: 'Media Viewer',
        icon: 'fa-solid fa-photo-film',
        color: '#f43f5e',
        pinned: false,
        isSystem: true,
        init: renderMediaViewer
      },
      {
        id: 'sysmon',
        title: 'System Monitor',
        icon: 'fa-solid fa-chart-line',
        color: '#06b6d4',
        pinned: false,
        isSystem: true,
        init: renderSystemMonitor
      }
    ];

    /* Centralized System State */
    let systemState = {
      activeWindows: {},
      topZIndex: 100,
      activeWindowId: null,
      trackpadOpen: false,
      precisionPencilMode: false,
      virtualCursor: { x: window.innerWidth / 2, y: window.innerHeight / 2 },
      authToken: sessionStorage.getItem('cros_auth_token') || null,
      internalClipboard: '',
      installedCustomApps: JSON.parse(localStorage.getItem('cros_installed_apps') || '[]'),
      hiddenApps: JSON.parse(localStorage.getItem('cros_hidden_apps') || '[]')
    };

    /* System-Wide Clipboard Helpers */
    const ClipboardService = {
      async copy(text) {
        systemState.internalClipboard = text;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          }
        } catch (_) {
          // Fallback handled via internal buffer
        }
        showToast('Copied to clipboard');
      },
      async read() {
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            const clip = await navigator.clipboard.readText();
            if (clip) return clip;
          }
        } catch (_) {}
        return systemState.internalClipboard || '';
      },
      cut() {
        const sel = window.getSelection().toString();
        if (sel) {
          this.copy(sel);
          document.execCommand('delete');
        }
      }
    };

    class WindowManager {
      constructor() {
        this.workspace = document.getElementById('desktop-workspace');
        this.snapPreview = document.getElementById('snap-preview');
        this.dragState = null;
        this.resizeState = null;
        this.initWorkspaceEvents();
      }

      open(appId, customTitle = null, customContent = null) {
        const app = APPS_REGISTRY.find(a => a.id === appId) || systemState.installedCustomApps.find(a => a.id === appId);
        if (!app) return;

        if (systemState.activeWindows[appId]) {
          const win = systemState.activeWindows[appId];
          win.element.classList.remove('minimized');
          this.focus(appId);
          return;
        }

        systemState.topZIndex++;
        const winEl = document.createElement('div');
        winEl.className = 'os-window glass flex flex-col';
        winEl.id = `window-${appId}`;
        winEl.style.zIndex = systemState.topZIndex;

        const isSmall = window.innerWidth < 800;
        const width = isSmall ? Math.min(window.innerWidth * 0.94, 620) : 700;
        const height = isSmall ? Math.min(window.innerHeight * 0.76, 500) : 500;
        const left = Math.max(16, (window.innerWidth - width) / 2 + (Math.random() * 24 - 12));
        const top = Math.max(16, (window.innerHeight - 48 - height) / 2 + (Math.random() * 24 - 12));

        winEl.style.width = `${width}px`;
        winEl.style.height = `${height}px`;
        winEl.style.left = `${left}px`;
        winEl.style.top = `${top}px`;

        winEl.innerHTML = `
          <!-- Window Title Bar -->
          <div class="window-titlebar h-9 px-3 bg-white/10 border-b border-white/10 flex items-center justify-between cursor-move">
            <div class="flex items-center space-x-2 pointer-events-none">
              <i class="${app.icon || 'fa-solid fa-cube'}" style="color: ${app.color || '#8ab4f8'};"></i>
              <span class="text-xs font-semibold text-gray-200 truncate max-w-[200px]">${customTitle || app.title}</span>
            </div>
            <div class="flex items-center space-x-2">
              <button class="win-btn-min w-3 h-3 rounded-full bg-yellow-500/80 hover:bg-yellow-400 focus:outline-none transition"></button>
              <button class="win-btn-max w-3 h-3 rounded-full bg-green-500/80 hover:bg-green-400 focus:outline-none transition"></button>
              <button class="win-btn-close w-3 h-3 rounded-full bg-red-500/80 hover:bg-red-400 focus:outline-none transition"></button>
            </div>
          </div>
          <!-- Window Content Area (Clean Touch & Pointer Pass-Through) -->
          <div class="window-content flex-1 overflow-auto bg-cros-bg/85 relative text-gray-200"></div>
          <!-- Resize Handles -->
          <div class="window-resize-handle resize-n" data-dir="n"></div>
          <div class="window-resize-handle resize-s" data-dir="s"></div>
          <div class="window-resize-handle resize-w" data-dir="w"></div>
          <div class="window-resize-handle resize-e" data-dir="e"></div>
          <div class="window-resize-handle resize-nw" data-dir="nw"></div>
          <div class="window-resize-handle resize-ne" data-dir="ne"></div>
          <div class="window-resize-handle resize-sw" data-dir="sw"></div>
          <div class="window-resize-handle resize-se" data-dir="se"></div>
        `;

        this.workspace.appendChild(winEl);

        const winObj = {
          id: appId,
          element: winEl,
          app: app,
          isMaximized: false,
          prevBounds: { left: `${left}px`, top: `${top}px`, width: `${width}px`, height: `${height}px` }
        };

        systemState.activeWindows[appId] = winObj;

        // Initialize application content
        const contentArea = winEl.querySelector('.window-content');
        if (customContent) {
          contentArea.innerHTML = customContent;
        } else if (app.customUrl) {
          contentArea.innerHTML = `<iframe src="${app.customUrl}" class="w-full h-full border-0" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>`;
        } else if (app.blobHtml) {
          const blob = new Blob([app.blobHtml], { type: 'text/html' });
          contentArea.innerHTML = `<iframe src="${URL.createObjectURL(blob)}" class="w-full h-full border-0"></iframe>`;
        } else if (typeof app.init === 'function') {
          app.init(contentArea, winObj);
        }

        // Window Control Buttons
        winEl.querySelector('.win-btn-min').addEventListener('click', (e) => { e.stopPropagation(); this.minimize(appId); });
        winEl.querySelector('.win-btn-max').addEventListener('click', (e) => { e.stopPropagation(); this.toggleMaximize(appId); });
        winEl.querySelector('.win-btn-close').addEventListener('click', (e) => { e.stopPropagation(); this.close(appId); });

        winEl.addEventListener('pointerdown', () => this.focus(appId));

        this.attachWindowDrag(winEl, winObj);
        this.attachWindowResize(winEl, winObj);

        this.focus(appId);
        updateShelf();
      }

      focus(appId) {
        const win = systemState.activeWindows[appId];
        if (!win) return;
        systemState.topZIndex += 2;
        win.element.style.zIndex = systemState.topZIndex;
        systemState.activeWindowId = appId;
        updateShelf();
      }

      minimize(appId) {
        const win = systemState.activeWindows[appId];
        if (!win) return;
        win.element.classList.add('minimized');
        if (systemState.activeWindowId === appId) systemState.activeWindowId = null;
        updateShelf();
      }

      toggleMaximize(appId) {
        const win = systemState.activeWindows[appId];
        if (!win) return;
        const el = win.element;

        if (win.isMaximized) {
          el.classList.remove('maximized');
          el.style.left = win.prevBounds.left;
          el.style.top = win.prevBounds.top;
          el.style.width = win.prevBounds.width;
          el.style.height = win.prevBounds.height;
          win.isMaximized = false;
        } else {
          win.prevBounds = { left: el.style.left, top: el.style.top, width: el.style.width, height: el.style.height };
          el.classList.add('maximized');
          el.style.left = '0px';
          el.style.top = '0px';
          el.style.width = '100%';
          el.style.height = '100%';
          win.isMaximized = true;
        }
      }

      close(appId) {
        const win = systemState.activeWindows[appId];
        if (!win) return;
        win.element.remove();
        delete systemState.activeWindows[appId];
        if (systemState.activeWindowId === appId) systemState.activeWindowId = null;
        updateShelf();
      }

      // Bugfix #1: Inject shields over iframes during drag & resize to avoid pointer trap
      injectIframeShields() {
        document.querySelectorAll('.os-window').forEach(win => {
          const content = win.querySelector('.window-content');
          if (content && content.querySelector('iframe') && !content.querySelector('.iframe-shield')) {
            const shield = document.createElement('div');
            shield.className = 'iframe-shield';
            content.appendChild(shield);
          }
        });
      }

      liftIframeShields() {
        document.querySelectorAll('.iframe-shield').forEach(s => s.remove());
      }

      attachWindowDrag(winEl, winObj) {
        const titlebar = winEl.querySelector('.window-titlebar');

        const onDown = (e) => {
          if (e.target.closest('button')) return;
          this.focus(winObj.id);
          this.injectIframeShields();

          this.dragState = {
            winEl,
            winObj,
            startX: e.clientX,
            startY: e.clientY,
            initialLeft: winEl.offsetLeft,
            initialTop: winEl.offsetTop
          };
          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp);
        };

        const onMove = (e) => {
          if (!this.dragState) return;
          const { winEl, winObj, startX, startY, initialLeft, initialTop } = this.dragState;

          if (winObj.isMaximized) {
            winEl.classList.remove('maximized');
            winObj.isMaximized = false;
            winEl.style.width = winObj.prevBounds.width;
            winEl.style.height = winObj.prevBounds.height;
          }

          let targetX = initialLeft + (e.clientX - startX);
          let targetY = Math.max(0, initialTop + (e.clientY - startY));

          winEl.style.left = `${targetX}px`;
          winEl.style.top = `${targetY}px`;

          // Edge Snap Detection
          const snapZone = 18;
          if (e.clientX <= snapZone) {
            this.snapPreview.style.left = '4px';
            this.snapPreview.style.top = '4px';
            this.snapPreview.style.width = 'calc(50% - 8px)';
            this.snapPreview.style.height = 'calc(100% - 8px)';
            this.snapPreview.style.opacity = '1';
            winObj.pendingSnap = 'left';
          } else if (e.clientX >= window.innerWidth - snapZone) {
            this.snapPreview.style.left = 'calc(50% + 4px)';
            this.snapPreview.style.top = '4px';
            this.snapPreview.style.width = 'calc(50% - 8px)';
            this.snapPreview.style.height = 'calc(100% - 8px)';
            this.snapPreview.style.opacity = '1';
            winObj.pendingSnap = 'right';
          } else if (e.clientY <= snapZone) {
            this.snapPreview.style.left = '4px';
            this.snapPreview.style.top = '4px';
            this.snapPreview.style.width = 'calc(100% - 8px)';
            this.snapPreview.style.height = 'calc(100% - 8px)';
            this.snapPreview.style.opacity = '1';
            winObj.pendingSnap = 'max';
          } else {
            this.snapPreview.style.opacity = '0';
            winObj.pendingSnap = null;
          }
        };

        const onUp = () => {
          if (!this.dragState) return;
          const { winEl, winObj } = this.dragState;

          if (winObj.pendingSnap === 'left') {
            winEl.style.left = '0px';
            winEl.style.top = '0px';
            winEl.style.width = '50%';
            winEl.style.height = '100%';
          } else if (winObj.pendingSnap === 'right') {
            winEl.style.left = '50%';
            winEl.style.top = '0px';
            winEl.style.width = '50%';
            winEl.style.height = '100%';
          } else if (winObj.pendingSnap === 'max') {
            this.toggleMaximize(winObj.id);
          }

          this.snapPreview.style.opacity = '0';
          winObj.pendingSnap = null;
          this.dragState = null;
          this.liftIframeShields();
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
        };

        titlebar.addEventListener('pointerdown', onDown);
      }

      attachWindowResize(winEl, winObj) {
        const handles = winEl.querySelectorAll('.window-resize-handle');
        handles.forEach(h => {
          h.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            this.focus(winObj.id);
            this.injectIframeShields();

            const dir = h.dataset.dir;
            this.resizeState = {
              winEl,
              dir,
              startX: e.clientX,
              startY: e.clientY,
              startW: winEl.offsetWidth,
              startH: winEl.offsetHeight,
              startLeft: winEl.offsetLeft,
              startTop: winEl.offsetTop
            };

            const onMove = (re) => {
              if (!this.resizeState) return;
              const { winEl, dir, startX, startY, startW, startH, startLeft, startTop } = this.resizeState;
              const dx = re.clientX - startX;
              const dy = re.clientY - startY;
              const minW = 300;
              const minH = 200;

              if (dir.includes('e')) winEl.style.width = `${Math.max(minW, startW + dx)}px`;
              if (dir.includes('s')) winEl.style.height = `${Math.max(minH, startH + dy)}px`;
              if (dir.includes('w')) {
                const nw = Math.max(minW, startW - dx);
                if (nw > minW) {
                  winEl.style.width = `${nw}px`;
                  winEl.style.left = `${startLeft + dx}px`;
                }
              }
              if (dir.includes('n')) {
                const nh = Math.max(minH, startH - dy);
                if (nh > minH) {
                  winEl.style.height = `${nh}px`;
                  winEl.style.top = `${startTop + dy}px`;
                }
              }
            };

            const onUp = () => {
              this.resizeState = null;
              this.liftIframeShields();
              window.removeEventListener('pointermove', onMove);
              window.removeEventListener('pointerup', onUp);
            };

            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onUp);
          });
        });
      }

      initWorkspaceEvents() {
        this.workspace.addEventListener('pointerdown', () => {
          document.getElementById('app-launcher-menu').classList.add('hidden', 'opacity-0');
          document.getElementById('quick-settings-menu').classList.add('hidden', 'opacity-0');
          document.getElementById('context-menu').classList.add('hidden');
          document.getElementById('floating-clipboard-bar').classList.add('hidden');
        });
      }
    }

    const wm = new WindowManager();

    class VirtualTrackpadController {
      constructor() {
        this.container = document.getElementById('trackpad-container');
        this.surface = document.getElementById('trackpad-surface');
        this.cursor = document.getElementById('virtual-cursor');
        this.dragBadge = document.getElementById('tp-drag-indicator');
        this.leftBtn = document.getElementById('tp-btn-left');
        this.rightBtn = document.getElementById('tp-btn-right');
        this.copyBtn = document.getElementById('tp-btn-copy');
        this.pasteBtn = document.getElementById('tp-btn-paste');
        this.toggleBtn = document.getElementById('trackpad-toggle-btn');
        this.closeBtn = document.getElementById('tp-close-btn');
        this.pencilBtn = document.getElementById('tp-pencil-mode-btn');

        this.touchPoints = new Map();
        this.sensitivity = 1.35;
        this.lastTapTime = 0;
        this.isTapDragActive = false;
        this.isButtonDragActive = false;
        this.latchedTarget = null;

        this.init();
      }

      init() {
        this.toggleBtn.addEventListener('click', () => this.toggleTrackpad());
        this.closeBtn.addEventListener('click', () => this.toggleTrackpad(false));
        this.pencilBtn.addEventListener('click', () => this.togglePrecision());

        this.surface.addEventListener('pointerdown', (e) => this.handlePointerDown(e));
        this.surface.addEventListener('pointermove', (e) => this.handlePointerMove(e));
        this.surface.addEventListener('pointerup', (e) => this.handlePointerUp(e));
        this.surface.addEventListener('pointercancel', (e) => this.handlePointerUp(e));

        // Hardware Bottom Left Button: Hold-to-Drag Mechanic
        this.leftBtn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          this.startHardwareButtonDrag();
        });
        window.addEventListener('pointerup', () => {
          if (this.isButtonDragActive) this.stopHardwareButtonDrag();
        });

        this.rightBtn.addEventListener('click', () => this.triggerClick('right'));
        this.copyBtn.addEventListener('click', () => this.triggerTrackpadClipboard('copy'));
        this.pasteBtn.addEventListener('click', () => this.triggerTrackpadClipboard('paste'));

        window.addEventListener('resize', () => this.adaptOrientation());
      }

      toggleTrackpad(force = null) {
        systemState.trackpadOpen = force !== null ? force : !systemState.trackpadOpen;
        if (systemState.trackpadOpen) {
          this.container.classList.remove('hidden');
          this.container.classList.add('trackpad-visible');
          this.cursor.classList.add('active');
          if (window.innerHeight > window.innerWidth) document.body.classList.add('trackpad-active-portrait');
        } else {
          this.container.classList.add('hidden');
          this.container.classList.remove('trackpad-visible');
          this.cursor.classList.remove('active');
          document.body.classList.remove('trackpad-active-portrait');
        }
      }

      togglePrecision() {
        systemState.precisionPencilMode = !systemState.precisionPencilMode;
        this.sensitivity = systemState.precisionPencilMode ? 0.75 : 1.35;
        this.pencilBtn.classList.toggle('text-blue-400', systemState.precisionPencilMode);
      }

      adaptOrientation() {
        if (!systemState.trackpadOpen) return;
        if (window.innerHeight > window.innerWidth) {
          document.body.classList.add('trackpad-active-portrait');
        } else {
          document.body.classList.remove('trackpad-active-portrait');
        }
      }

      handlePointerDown(e) {
        this.surface.setPointerCapture(e.pointerId);
        const now = Date.now();
        const timeSinceLastTap = now - this.lastTapTime;

        // Bugfix #2: Tap-and-Half Drag Detection (Double tap down and hold)
        if (timeSinceLastTap < 260 && this.touchPoints.size === 0) {
          this.isTapDragActive = true;
          this.dragBadge.classList.remove('hidden');
          this.latchedTarget = document.elementFromPoint(systemState.virtualCursor.x, systemState.virtualCursor.y);
          if (this.latchedTarget) {
            this.dispatchSyntheticPointer('pointerdown', this.latchedTarget);
          }
        }

        this.touchPoints.set(e.pointerId, {
          x: e.clientX,
          y: e.clientY,
          startX: e.clientX,
          startY: e.clientY,
          time: now
        });
      }

      handlePointerMove(e) {
        if (!this.touchPoints.has(e.pointerId)) return;
        const prev = this.touchPoints.get(e.pointerId);
        const dx = (e.clientX - prev.x) * this.sensitivity;
        const dy = (e.clientY - prev.y) * this.sensitivity;

        // Two-Finger Vertical Scroll
        if (this.touchPoints.size === 2) {
          const activeWin = systemState.activeWindows[systemState.activeWindowId];
          if (activeWin) {
            const scroller = activeWin.element.querySelector('.window-content');
            if (scroller) scroller.scrollTop += dy * 1.5;
          }
        } else {
          // Move virtual cursor
          systemState.virtualCursor.x = Math.max(0, Math.min(window.innerWidth - 6, systemState.virtualCursor.x + dx));
          systemState.virtualCursor.y = Math.max(0, Math.min(window.innerHeight - 6, systemState.virtualCursor.y + dy));
          this.updateCursorPosition();

          // Dispatch synthetic pointermove if actively dragging
          if ((this.isTapDragActive || this.isButtonDragActive) && this.latchedTarget) {
            this.dispatchSyntheticPointer('pointermove', this.latchedTarget);
          }
        }

        this.touchPoints.set(e.pointerId, { ...prev, x: e.clientX, y: e.clientY });
      }

      handlePointerUp(e) {
        const point = this.touchPoints.get(e.pointerId);
        if (point) {
          const duration = Date.now() - point.time;
          const dist = Math.hypot(e.clientX - point.startX, e.clientY - point.startY);

          if (this.isTapDragActive) {
            // End of Tap-and-Half Drag
            this.isTapDragActive = false;
            this.dragBadge.classList.add('hidden');
            if (this.latchedTarget) {
              this.dispatchSyntheticPointer('pointerup', this.latchedTarget);
              this.latchedTarget = null;
            }
          } else if (duration < 220 && dist < 8) {
            // Clean Single or Two-finger Tap
            if (this.touchPoints.size >= 2) {
              this.triggerClick('right');
            } else {
              this.triggerClick('left');
            }
          }
          this.lastTapTime = Date.now();
        }
        this.touchPoints.delete(e.pointerId);
      }

      startHardwareButtonDrag() {
        this.isButtonDragActive = true;
        this.dragBadge.classList.remove('hidden');
        this.latchedTarget = document.elementFromPoint(systemState.virtualCursor.x, systemState.virtualCursor.y);
        if (this.latchedTarget) {
          this.dispatchSyntheticPointer('pointerdown', this.latchedTarget);
        }
      }

      stopHardwareButtonDrag() {
        this.isButtonDragActive = false;
        this.dragBadge.classList.add('hidden');
        if (this.latchedTarget) {
          this.dispatchSyntheticPointer('pointerup', this.latchedTarget);
          this.latchedTarget = null;
        }
      }

      dispatchSyntheticPointer(type, target) {
        const evt = new PointerEvent(type, {
          bubbles: true,
          cancelable: true,
          clientX: systemState.virtualCursor.x,
          clientY: systemState.virtualCursor.y,
          pointerType: systemState.precisionPencilMode ? 'pen' : 'mouse',
          pressure: 0.5,
          buttons: 1
        });
        target.dispatchEvent(evt);
      }

      updateCursorPosition() {
        this.cursor.style.left = `${systemState.virtualCursor.x}px`;
        this.cursor.style.top = `${systemState.virtualCursor.y}px`;
      }

      triggerClick(type = 'left') {
        const target = document.elementFromPoint(systemState.virtualCursor.x, systemState.virtualCursor.y);
        if (!target) return;

        // Visual flash indicator
        const flash = document.createElement('div');
        flash.className = 'fixed w-6 h-6 rounded-full border border-blue-400 bg-blue-400/25 pointer-events-none z-[999999]';
        flash.style.left = `${systemState.virtualCursor.x - 12}px`;
        flash.style.top = `${systemState.virtualCursor.y - 12}px`;
        document.body.appendChild(flash);
        setTimeout(() => flash.remove(), 160);

        if (type === 'right') {
          spawnContextMenu(systemState.virtualCursor.x, systemState.virtualCursor.y, target);
        } else {
          target.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: systemState.virtualCursor.x, clientY: systemState.virtualCursor.y }));
          if (typeof target.focus === 'function') target.focus();

          // Show floating clipboard bar if text is selected
          setTimeout(() => {
            const selectedText = window.getSelection().toString().trim();
            if (selectedText.length > 0) {
              spawnFloatingClipboard(systemState.virtualCursor.x, systemState.virtualCursor.y);
            }
          }, 60);
        }
      }

      async triggerTrackpadClipboard(action) {
        if (action === 'copy') {
          const sel = window.getSelection().toString();
          if (sel) await ClipboardService.copy(sel);
        } else if (action === 'paste') {
          const text = await ClipboardService.read();
          const target = document.elementFromPoint(systemState.virtualCursor.x, systemState.virtualCursor.y);
          if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA')) {
            const start = target.selectionStart || 0;
            const end = target.selectionEnd || 0;
            target.value = target.value.substring(0, start) + text + target.value.substring(end);
            target.dispatchEvent(new Event('input', { bubbles: true }));
          }
        }
      }
    }

    const trackpad = new VirtualTrackpadController();

    function spawnFloatingClipboard(x, y) {
      const bar = document.getElementById('floating-clipboard-bar');
      bar.style.left = `${Math.min(window.innerWidth - 180, Math.max(12, x - 70))}px`;
      bar.style.top = `${Math.max(12, y - 48)}px`;
      bar.classList.remove('hidden');
    }

    document.getElementById('clip-copy-btn').addEventListener('click', async () => {
      const sel = window.getSelection().toString();
      if (sel) await ClipboardService.copy(sel);
      document.getElementById('floating-clipboard-bar').classList.add('hidden');
    });

    document.getElementById('clip-cut-btn').addEventListener('click', () => {
      ClipboardService.cut();
      document.getElementById('floating-clipboard-bar').classList.add('hidden');
    });

    document.getElementById('clip-paste-btn').addEventListener('click', async () => {
      const text = await ClipboardService.read();
      const activeEl = document.activeElement;
      if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) {
        const start = activeEl.selectionStart || 0;
        const end = activeEl.selectionEnd || 0;
        activeEl.value = activeEl.value.substring(0, start) + text + activeEl.value.substring(end);
        activeEl.dispatchEvent(new Event('input', { bubbles: true }));
      }
      document.getElementById('floating-clipboard-bar').classList.add('hidden');
    });

    function spawnContextMenu(x, y, target) {
      const menu = document.getElementById('context-menu');
      menu.innerHTML = '';

      const appEl = target.closest('[data-appid]');
      const appId = appEl ? appEl.dataset.appid : null;
      const app = appId ? (APPS_REGISTRY.find(a => a.id === appId) || systemState.installedCustomApps.find(a => a.id === appId)) : null;

      if (app) {
        // App Context Menu: Pin/Unpin, Hide/Unhide, Uninstall
        const isHidden = systemState.hiddenApps.includes(app.id);
        menu.innerHTML = `
          <div class="px-3 py-1 font-semibold text-gray-300 border-b border-white/10 truncate">${app.title}</div>
          <button class="ctx-item w-full text-left px-3 py-1.5 hover:bg-white/10 flex items-center space-x-2" data-action="toggle-pin">
            <i class="fa-solid fa-thumbtack text-blue-400"></i>
            <span>${app.pinned ? 'Unpin from Shelf' : 'Pin to Shelf'}</span>
          </button>
          <button class="ctx-item w-full text-left px-3 py-1.5 hover:bg-white/10 flex items-center space-x-2" data-action="toggle-hide">
            <i class="fa-solid ${isHidden ? 'fa-eye' : 'fa-eye-slash'} text-yellow-400"></i>
            <span>${isHidden ? 'Unhide from Desktop' : 'Hide from Desktop'}</span>
          </button>
          ${
            !app.isSystem
              ? `
              <button class="ctx-item w-full text-left px-3 py-1.5 hover:bg-red-500/20 text-red-300 flex items-center space-x-2" data-action="uninstall">
                <i class="fa-solid fa-trash-can text-red-400"></i>
                <span>Uninstall App</span>
              </button>
              `
              : ''
          }
        `;

        menu.querySelectorAll('.ctx-item').forEach(btn => {
          btn.addEventListener('click', () => {
            const action = btn.dataset.action;
            if (action === 'toggle-pin') {
              app.pinned = !app.pinned;
              updateShelf();
            } else if (action === 'toggle-hide') {
              toggleHideApp(app.id);
            } else if (action === 'uninstall') {
              uninstallApp(app.id);
            }
            menu.classList.add('hidden');
          });
        });
      } else {
        // General Desktop Context Menu

    function toggleHideApp(appId) {
      if (systemState.hiddenApps.includes(appId)) {
        systemState.hiddenApps = systemState.hiddenApps.filter(id => id !== appId);
      } else {
        systemState.hiddenApps.push(appId);
      }
      localStorage.setItem('cros_hidden_apps', JSON.stringify(systemState.hiddenApps));
      renderDesktopIcons();
      renderLauncherGrid();
      showToast('Updated app visibility');
    }

    async function uninstallApp(appId) {
      // Close window if open
      if (systemState.activeWindows[appId]) wm.close(appId);

      systemState.installedCustomApps = systemState.installedCustomApps.filter(a => a.id !== appId);
      systemState.hiddenApps = systemState.hiddenApps.filter(id => id !== appId);

      localStorage.setItem('cros_installed_apps', JSON.stringify(systemState.installedCustomApps));
      localStorage.setItem('cros_hidden_apps', JSON.stringify(systemState.hiddenApps));

      renderDesktopIcons();
      renderLauncherGrid();
      updateShelf();

      // Synchronize deletion to Google Sheet backend
      syncCloudBackend('uninstall_app', { appId });
      showToast('App uninstalled cleanly');

    function updateShelf() {
      const container = document.getElementById('shelf-apps-container');
      container.innerHTML = '';

      const allApps = [...APPS_REGISTRY, ...systemState.installedCustomApps];
      const shelfApps = allApps.filter(a => a.pinned || systemState.activeWindows[a.id]);

      shelfApps.forEach(app => {
        const isRunning = !!systemState.activeWindows[app.id];
        const isActive = systemState.activeWindowId === app.id;

        const btn = document.createElement('button');
        btn.className = `relative w-9 h-9 rounded-xl flex items-center justify-center transition-all ${
          isActive ? 'bg-white/20 scale-105' : 'hover:bg-white/10'
        }`;
        btn.dataset.appid = app.id;
        btn.title = app.title;
        btn.innerHTML = `
          <div class="w-7 h-7 rounded-lg flex items-center justify-center" style="background-color: ${app.color || '#3b82f6'};">
            <i class="${app.icon || 'fa-solid fa-cube'} text-xs text-white"></i>
          </div>
          ${isRunning ? `<div class="absolute bottom-0.5 w-1.5 h-1.5 rounded-full ${isActive ? 'bg-blue-400' : 'bg-white/60'}"></div>` : ''}
        `;

        btn.addEventListener('click', () => {
          if (isRunning) {
            const win = systemState.activeWindows[app.id];
            if (win.element.classList.contains('minimized')) {
              win.element.classList.remove('minimized');
              wm.focus(app.id);
            } else if (systemState.activeWindowId === app.id) {
              wm.minimize(app.id);
            } else {
              wm.focus(app.id);
            }
          } else {
            wm.open(app.id);
          }
        });

        btn.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          spawnContextMenu(e.clientX, e.clientY, btn);
        });

        container.appendChild(btn);
      });
    }

    function renderScriptInspector(container) {
      const codeGSSource = `/**
 * iPad Mini 6 WebOS Cloud Backend - Production Code.gs
 * Fully self-contained Google Apps Script Web App Deployment
 */

function doGet(e) {
  var action = (e && e.parameter && e.parameter.action) || 'ping';
  if (action === 'ping') {
    return ContentService.createTextOutput(JSON.stringify({ status: 'ok', time: new Date() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
  if (action === 'setup') {
    return ContentService.createTextOutput(JSON.stringify(doSetup()))
      .setMimeType(ContentService.MimeType.JSON);
  }
  return ContentService.createTextOutput(JSON.stringify({ error: 'Unsupported action' }))
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var data = {};
  try {
    data = JSON.parse(e.postData.contents);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ error: 'Invalid JSON payload' }))
      .setMimeType(ContentService.MimeType.JSON);
  }

  // Verify Admin Authentication
  if (data.action === 'login') {
    var adminHash = PropertiesService.getScriptProperties().getProperty('ADMIN_PASSWORD') || 'admin123';
    if (data.payload.password === adminHash) {
      var sessionToken = Utilities.getUuid();
      PropertiesService.getScriptProperties().setProperty('ACTIVE_TOKEN', sessionToken);
      return ContentService.createTextOutput(JSON.stringify({ status: 'authenticated', token: sessionToken }))
        .setMimeType(ContentService.MimeType.JSON);
    }
    return ContentService.createTextOutput(JSON.stringify({ status: 'error', message: 'Unauthorized' }))
      .setMimeType(ContentService.MimeType.JSON);
  }

  // Provisioning Schema Bugfix #4
  if (data.action === 'init_schema') {
    return ContentService.createTextOutput(JSON.stringify(doSetup()))
      .setMimeType(ContentService.MimeType.JSON);
  }

  // App Installation Sync
  if (data.action === 'install_app') {
    var ss = getOrCreateSheetDB();
    var appsSheet = ss.getSheetByName('Installed_Apps');
    var app = data.payload;
    appsSheet.appendRow([app.id, app.title, app.customUrl ? 'PWA' : 'HTML_BLOB', app.customUrl || 'local', new Date(), app.pinned, false]);
    return ContentService.createTextOutput(JSON.stringify({ status: 'app_recorded' }))
      .setMimeType(ContentService.MimeType.JSON);
  }

  // App Uninstallation Sync
  if (data.action === 'uninstall_app') {
    var ss = getOrCreateSheetDB();
    var appsSheet = ss.getSheetByName('Installed_Apps');
    var rows = appsSheet.getDataRange().getValues();
    for (var i = 1; i < rows.length; i++) {
      if (rows[i][0] === data.payload.appId) {
        appsSheet.deleteRow(i + 1);
        break;
      }
    }
    return ContentService.createTextOutput(JSON.stringify({ status: 'app_removed' }))
      .setMimeType(ContentService.MimeType.JSON);
  }

  // Dynamic Third-Party App Dynamic Tab Auto-Creation
  if (data.action === 'app_data_commit') {
    var ss = getOrCreateSheetDB();
    var tabName = String(data.appId).substring(0, 30);
    var sheet = ss.getSheetByName(tabName);
    if (!sheet) {
      sheet = ss.insertSheet(tabName);
      sheet.appendRow(['Timestamp', 'Record_Key', 'JSON_Data']);
      sheet.getRange('A1:C1').setFontWeight('bold').setBackground('#202634').setFontColor('#ffffff');
    }
    sheet.appendRow([new Date(), data.recordKey || 'data', JSON.stringify(data.payload)]);
    return ContentService.createTextOutput(JSON.stringify({ status: 'committed' }))
      .setMimeType(ContentService.MimeType.JSON);
  }

  return ContentService.createTextOutput(JSON.stringify({ status: 'done' }))
    .setMimeType(ContentService.MimeType.JSON);
}

  ensureSheetWithHeaders(ss, 'Settings', ['Setting_Key', 'Setting_Value', 'Last_Updated'], [

  ensureSheetWithHeaders(ss, 'Installed_Apps', ['App_ID', 'App_Title', 'App_Type', 'App_URL', 'Installed_Date', 'Is_Pinned', 'Is_Hidden']);

  // 3. Pencil_Notes Tab
  ensureSheetWithHeaders(ss, 'Pencil_Notes', ['Note_ID', 'Title', 'Timestamp', 'Vector_Data_JSON']);

  // 4. System_Logs Tab
  ensureSheetWithHeaders(ss, 'System_Logs', ['Timestamp', 'User_Agent', 'Action_Type', 'Status_Message']);

  return {
    status: 'configured',
    folderId: folder.getId(),
    sheetId: ss.getId(),
    timestamp: new Date()
  };
}

function ensureSheetWithHeaders(ss, sheetName, headers, defaultRows) {
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) {
    sheet = ss.insertSheet(sheetName);
    sheet.appendRow(headers);
    sheet.getRange(1, 1, 1, headers.length).setFontWeight('bold').setBackground('#202634').setFontColor('#ffffff');
    if (defaultRows && defaultRows.length > 0) {
      defaultRows.forEach(function(r) { sheet.appendRow(r); });
    }
  }
  return sheet;
}

function getOrCreateDriveFolder() {
  var name = 'iPad_Mini_WebOS_Drive';
  var folders = DriveApp.getFoldersByName(name);
  return folders.hasNext() ? folders.next() : DriveApp.createFolder(name);
}

function getOrCreateSheetDB() {
  var name = 'iPad_Mini_WebOS_DB';
  var files = DriveApp.getFilesByName(name);
  if (files.hasNext()) {
    return SpreadsheetApp.open(files.next());
  }
  var ss = SpreadsheetApp.create(name);
  var defaultSheet = ss.getSheets()[0];
  defaultSheet.setName('Settings');
  defaultSheet.appendRow(['Setting_Key', 'Setting_Value', 'Last_Updated']);
  defaultSheet.getRange('A1:C1').setFontWeight('bold').setBackground('#202634').setFontColor('#ffffff');
  return ss;
}`;

    function renderPencilNotes(container) {
      container.innerHTML = `
        <div class="flex flex-col h-full bg-slate-900">
          <div class="h-10 px-3 bg-slate-800/90 border-b border-white/10 flex items-center justify-between text-xs">
            <div class="flex items-center space-x-2">
              <button class="pencil-tool-btn px-2.5 py-1 rounded bg-blue-600 text-white font-medium" data-tool="pen">
                <i class="fa-solid fa-pen mr-1"></i> Pen
              </button>
              <button class="pencil-tool-btn px-2.5 py-1 rounded bg-white/10 text-gray-300" data-tool="highlighter">
                <i class="fa-solid fa-highlighter mr-1"></i> Highlighter
              </button>
              <button class="pencil-tool-btn px-2.5 py-1 rounded bg-white/10 text-gray-300" data-tool="eraser">
                <i class="fa-solid fa-eraser mr-1"></i> Eraser
              </button>
              <input type="color" id="note-color-picker" value="#ffffff" class="w-6 h-6 rounded border-0 bg-transparent cursor-pointer">
            </div>
            <button id="note-clear-btn" class="px-2.5 py-1 rounded bg-white/10 hover:bg-red-500/30 text-gray-300">Clear</button>
          </div>
          <div class="flex-1 relative overflow-hidden" id="pencil-wrapper">
            <canvas id="pencil-canvas" class="w-full h-full block cursor-crosshair"></canvas>
          </div>
        </div>
      `;

      const canvas = container.querySelector('#pencil-canvas');
      const wrapper = container.querySelector('#pencil-wrapper');
      const ctx = canvas.getContext('2d');
      let isDrawing = false;
      let currentTool = 'pen';
      let strokeColor = '#ffffff';

      setTimeout(() => {
        canvas.width = wrapper.clientWidth;
        canvas.height = wrapper.clientHeight;
      }, 60);

      container.querySelectorAll('.pencil-tool-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          container.querySelectorAll('.pencil-tool-btn').forEach(b => b.className = 'pencil-tool-btn px-2.5 py-1 rounded bg-white/10 text-gray-300');
          btn.className = 'pencil-tool-btn px-2.5 py-1 rounded bg-blue-600 text-white font-medium';
          currentTool = btn.dataset.tool;
        });
      });

      container.querySelector('#note-color-picker').addEventListener('change', (e) => {
        strokeColor = e.target.value;
      });

      container.querySelector('#note-clear-btn').addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      });

      let lastX = 0;
      let lastY = 0;

      // Pointer Events handling touch, mouse, and Apple Pencil with pressure sensitivity
      canvas.addEventListener('pointerdown', (e) => {
        if (systemState.precisionPencilMode && e.pointerType === 'touch') return; // Palm rejection
        isDrawing = true;
        const rect = canvas.getBoundingClientRect();
        lastX = e.clientX - rect.left;
        lastY = e.clientY - rect.top;
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const curX = e.clientX - rect.left;
        const curY = e.clientY - rect.top;

        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(curX, curY);

        const pressure = (e.pressure && e.pressure > 0) ? e.pressure : 0.5;

        if (currentTool === 'pen') {
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = Math.max(1.5, pressure * 6);
          ctx.lineCap = 'round';
          ctx.globalAlpha = 1.0;
        } else if (currentTool === 'highlighter') {
          ctx.strokeStyle = '#fef08a';
          ctx.lineWidth = 18;
          ctx.lineCap = 'square';
          ctx.globalAlpha = 0.35;
        } else if (currentTool === 'eraser') {
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 26;
          ctx.lineCap = 'round';
          ctx.globalAlpha = 1.0;
        }

        ctx.stroke();
        lastX = curX;
        lastY = curY;
      });

      const stop = () => { isDrawing = false; };
      canvas.addEventListener('pointerup', stop);
      canvas.addEventListener('pointercancel', stop);
    }

          const div = document.createElement('div');
          div.textContent = `admin@cros:~$ ${val}`;

          if (val === 'help') {
            const h = document.createElement('div');
            h.textContent = 'Commands: help, apps, clear, storage, ping';
            screen.appendChild(h);
          } else if (val === 'apps') {
            const h = document.createElement('div');
            h.textContent = 'Installed: ' + [...APPS_REGISTRY, ...systemState.installedCustomApps].map(a => a.title).join(', ');
